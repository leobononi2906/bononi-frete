<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Frete — Bononi</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500;600&display=swap');
:root{
  --bg:#F0F3F8;--surface:#FFFFFF;--surface2:#F7F9FC;--border:#E2E8F2;
  --accent:#1A3A8F;--green:#0F9D6E;--danger:#D93025;--warn:#E07B00;
  --text:#0F1D35;--muted:#5A6A85;--blue:#0077CC;--purple:#8b5cf6;
  --blue-light:#00AAEE;--blue-pale:#E8F4FD;
  --success-bg:#E8F8F3;--warning-bg:#FEF5E7;--destructive-bg:#FEF0EF;
  --sidebar-bg:#1A3A8F;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'DM Sans',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text)}
#app{display:flex;height:100vh;overflow:hidden}

/* SIDEBAR */
#sidebar{width:220px;min-width:220px;background:var(--sidebar-bg);border-right:none;display:flex;flex-direction:column;transition:transform .25s;z-index:50}
.sb-logo{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.15)}
.sb-brand{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:rgba(255,255,255,.45);display:block;margin-bottom:2px}
.sb-title{font-size:16px;font-weight:700;color:#fff}
nav{flex:1;padding:10px 8px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:9px;cursor:pointer;font-size:13.5px;color:rgba(255,255,255,.65);margin-bottom:2px;transition:all .15s;border:1px solid transparent;user-select:none}
.nav-item:active{opacity:.7}
.nav-item.active{background:rgba(0,170,238,.18);color:var(--blue-light);border-color:rgba(0,170,238,.25);border-left:3px solid var(--blue-light)}
.nav-icon{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.sb-footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,.15)}
#sb-user{font-weight:600;color:#fff;margin-bottom:4px;font-size:13px}
.btn-sair{color:rgba(255,255,255,.5);cursor:pointer;font-size:12px}

/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;min-height:56px;flex-shrink:0;gap:10px;box-shadow:0 1px 3px rgba(15,29,53,0.04)}
#menu-btn{display:none;background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:6px;border-radius:6px;flex-shrink:0}
.topbar h1{font-size:15px;font-weight:600;color:var(--accent)}
.topbar-sub{font-size:11px;color:var(--muted);margin-top:1px}
.page{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}

/* OVERLAY */
#overlay{display:none;position:fixed;inset:0;background:rgba(15,29,53,.4);z-index:49}
#overlay.open{display:block}

/* CONFIRM MODAL */
.confirm-overlay{position:fixed;inset:0;background:rgba(15,29,53,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.confirm-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;width:100%;max-width:360px;text-align:center;box-shadow:0 8px 32px rgba(15,29,53,.15)}

/* BOTÃO COTAR FIXO */
#sticky-cotar{position:fixed;bottom:0;left:0;right:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);z-index:40;display:flex;gap:8px}
@media(min-width:768px){#sticky-cotar{left:220px}}
.confirm-box p{font-size:14px;margin-bottom:20px;line-height:1.5}
.confirm-btns{display:flex;gap:10px;justify-content:center}

/* INPUTS */
input,select,textarea{font-family:'DM Sans',inherit;font-size:16px;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:11px 12px;outline:none;-webkit-appearance:none;width:100%;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(26,58,143,.1)}
input:focus,select:focus{border-color:var(--accent)}
input::placeholder{color:var(--muted)}
select option{background:var(--surface2)}
textarea{resize:vertical;min-height:72px}

/* BTNS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .15s;user-select:none;font-family:inherit}
.btn:active{opacity:.75;transform:scale(.98)}
.btn-primary{background:var(--accent);color:#fff}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-danger{background:var(--destructive-bg);color:var(--danger);border:1px solid rgba(217,48,37,.3)}
.btn-success{background:var(--success-bg);color:var(--green);border:1px solid rgba(15,157,110,.3)}
.btn-purple{background:rgba(139,92,246,.12);color:var(--purple);border:1px solid rgba(139,92,246,.3)}
.btn-full{width:100%}
.btn-sm{padding:7px 13px;font-size:12.5px}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(15,29,53,0.04)}
.card-title{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:7px}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:14px;box-shadow:0 1px 3px rgba(15,29,53,0.04)}
.stat-lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-bottom:5px;font-weight:600}
.stat-val{font-size:24px;font-weight:700;font-family:'DM Mono',monospace}
.c-green .stat-val{color:var(--green)}.c-warn .stat-val{color:var(--warn)}.c-red .stat-val{color:var(--danger)}.c-blue .stat-val{color:var(--blue)}

/* FORM */
.grid{display:grid;gap:12px;margin-bottom:14px}
.g2{grid-template-columns:1fr 1fr}
.g1{grid-template-columns:1fr}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11.5px;color:var(--muted);font-weight:500}
.field.full{grid-column:1/-1}

/* VOLUME BOX */
.vol-box{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}
.vol-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.vol-lbl{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

/* PRODUTOS */
.prod-search-wrap{margin-bottom:10px}
.prod-search-wrap input{width:100%}
.prod-table-wrap{max-height:220px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;margin-top:6px;background:var(--surface)}
.prod-table{width:100%;border-collapse:collapse;font-size:12px}
.prod-table th{position:sticky;top:0;background:var(--surface2);padding:6px 8px;text-align:left;font-size:11px;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}
.prod-table td{padding:8px;border-bottom:1px solid var(--border);vertical-align:middle}
.prod-table tbody tr:hover td,.prod-table tbody tr:active td{background:var(--blue-pale)}

/* TABS */
.tabs{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px}
.tab{border:none;background:transparent;padding:8px 16px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit}
.tab.active{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(15,29,53,.08)}

/* VOL TABLE (resumo) */
.vol-table{width:100%;border-collapse:collapse;font-size:12.5px}
.vol-table th{padding:8px;text-align:left;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);white-space:nowrap}
.vol-table td{padding:8px;border-bottom:1px solid var(--border);vertical-align:middle}
.vol-table tfoot td{border-bottom:none;padding-top:10px}
.prod-table tr:last-child td{border-bottom:none}
.prod-table .btn-sel{padding:4px 10px;font-size:11px;white-space:nowrap}
.prod-list{margin-top:8px}
.prod-item{
  background:var(--surface2);border:1px solid var(--border);border-radius:8px;
  padding:10px 12px;margin-bottom:8px;
}
.prod-item-hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.prod-item-nome{font-size:13px;font-weight:600;line-height:1.3}
.prod-item-dims{font-size:11.5px;color:var(--muted);margin-top:2px}
.prod-item-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.prod-item-row label{font-size:11.5px;color:var(--muted);flex-shrink:0}
.prod-item-row input{max-width:80px;padding:6px 8px;font-size:13px;text-align:center}
.badge-novo{background:rgba(139,92,246,.15);color:var(--purple);font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;flex-shrink:0}
.badge-catalogo{background:rgba(59,130,246,.15);color:var(--blue);font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;flex-shrink:0}
.badge-dim{background:rgba(16,185,129,.15);color:var(--green);font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;flex-shrink:0}

/* RESULTADO COTAÇÃO */
.result-grid{display:grid;gap:12px}
.r-card{background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:16px;position:relative}
.r-card.winner{border-color:var(--green);background:var(--success-bg)}
.r-winner-badge{position:absolute;top:-9px;right:12px;background:var(--green);color:#fff;font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px}
.r-transp{font-size:14px;font-weight:700;margin-bottom:3px}
.r-prazo{font-size:12px;color:var(--muted);margin-bottom:10px}
.r-preco{font-size:26px;font-weight:800}
.r-card.winner .r-preco{color:var(--green)}
.r-detail{font-size:12px;color:var(--muted);margin-top:4px}
.r-error .r-preco{color:var(--danger);font-size:15px;font-weight:700;line-height:1.25}
.err-box{display:flex;gap:12px;align-items:flex-start;border-left:3px solid var(--danger);background:var(--surface)}
.err-ic{font-size:22px;line-height:1}
.err-tit{font-size:14px;font-weight:700;color:var(--danger);margin-bottom:3px}
.err-det{font-size:12.5px;color:var(--muted);line-height:1.4}
.err-tec{margin-top:8px}
.err-tec summary{font-size:10.5px;color:var(--muted);cursor:pointer;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.err-tec code{display:block;margin-top:5px;font-family:'DM Mono',monospace;font-size:10.5px;color:var(--muted);background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:6px 8px;word-break:break-all;white-space:pre-wrap}
.r-error{border-color:rgba(239,68,68,.25)}

/* AUDITORIA */
.cte-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}
.cte-hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.cte-num{font-size:14px;font-weight:700}
.cte-sub{font-size:12px;color:var(--muted);margin-top:2px}
.cte-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:13px;border-bottom:1px solid rgba(42,47,63,.6)}
.cte-row:last-of-type{border-bottom:none}
.cte-lbl{color:var(--muted);font-size:11.5px}
.div-pos{color:var(--danger);font-weight:700}
.div-neg{color:var(--green);font-weight:700}
.cte-obs{margin-top:10px}
.cte-obs textarea{font-size:13px;padding:8px 10px;min-height:56px}
.cte-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.audit-select{width:100%;margin-top:8px;padding:9px 12px;font-size:14px}

/* DESKTOP TABLE */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;padding:9px 12px;background:var(--surface2);color:var(--muted);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:hover{background:var(--surface2)}
tbody td{padding:9px 12px;vertical-align:middle}
td select{padding:5px 8px;font-size:12px;border-radius:6px}

/* HIST CARD mobile */
.hist-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:13px;margin-bottom:10px}
.hist-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:13px}
.hist-lbl{color:var(--muted);font-size:11.5px}

/* LOGS */
.log-item{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px;cursor:pointer}
.log-item.log-ERRO{border-left:3px solid var(--danger)}
.log-item.log-ACAO{border-left:3px solid var(--green)}
.log-item.log-INFO{border-left:3px solid var(--warn)}
.log-icon{font-size:17px;flex-shrink:0}
.log-body{flex:1;min-width:0}
.log-desc{font-size:13.5px;margin-bottom:4px;word-break:break-word}
.log-meta{font-size:11.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.log-detail{margin-top:8px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px;font-family:monospace;font-size:11px;color:#a5b4fc;white-space:pre-wrap;display:none;max-height:180px;overflow-y:auto}
.log-detail.open{display:block}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:10.5px;font-weight:700;white-space:nowrap;text-transform:uppercase;letter-spacing:.05em}
.b-ok{background:var(--success-bg);color:var(--green)}
.b-warn{background:var(--warning-bg);color:var(--warn)}
.b-red{background:var(--destructive-bg);color:var(--danger)}
.b-gray{background:var(--surface2);color:var(--muted)}
.b-blue{background:var(--blue-pale);color:var(--blue)}
.b-purple{background:rgba(139,92,246,.12);color:var(--purple)}
.tag{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);margin:2px}

/* MISC */
.spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{display:flex;align-items:center;gap:12px;padding:24px;color:var(--muted);font-size:13px}
#toasts{position:fixed;bottom:76px;right:12px;display:flex;flex-direction:column;gap:8px;z-index:200;max-width:calc(100vw - 24px)}
.toast{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 16px;font-size:13px;display:flex;align-items:center;gap:9px;box-shadow:0 4px 20px rgba(15,29,53,.15);animation:si .2s ease}
.toast.success{border-left:3px solid var(--green)}.toast.error{border-left:3px solid var(--danger)}.toast.info{border-left:3px solid var(--blue)}
@keyframes si{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.hidden{display:none!important}
.flex{display:flex}.gap-2{gap:8px}.ac{align-items:center}.jb{justify-content:space-between}
.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .ei{font-size:40px;margin-bottom:10px}
.divider{border:none;border-top:1px solid var(--border);margin:14px 0}
.section-lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:700;margin:14px 0 8px;padding-left:2px}
.text-muted{color:var(--muted)}.text-red{color:var(--danger)}.text-green{color:var(--green)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.fi{flex:1;min-width:120px;padding:9px 12px;font-size:14px}

/* RESPONSIVE */
@media(max-width:768px){
  #sidebar{position:fixed;top:0;left:0;bottom:0;transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0)}
  #menu-btn{display:block}
  .g2{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:1fr 1fr}
  .result-grid{grid-template-columns:1fr}
  .desktop-only{display:none}
  #toasts{bottom:16px}
}
@media(min-width:769px){
  .result-grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
  .stats-grid{grid-template-columns:repeat(4,1fr)}
  .grid.g2{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .mobile-only{display:none}
  #toasts{bottom:24px;right:24px}
}
</style>
</head>
<body>

<!-- Auth removido — acesso direto -->

<div id="overlay" onclick="closeSb()"></div>

<div id="app">
  <div id="sidebar">
    <div class="sb-logo">
      <span class="sb-brand">Bononi Acessórios</span>
      <div class="sb-title">🚚 Frete</div>
    </div>
    <nav>
      <div class="nav-item active" id="nav-cotar" onclick="go('cotar')"><span class="nav-icon">💰</span>Cotar Frete</div>
      <div class="nav-item" id="nav-auditoria" onclick="go('auditoria')"><span class="nav-icon">🧾</span>Auditoria CTe</div>
      <div class="nav-item" id="nav-conferencia" onclick="go('conferencia')"><span class="nav-icon">💸</span>Conferência</div>
      <div class="nav-item" id="nav-historico" onclick="go('historico')"><span class="nav-icon">📋</span>Histórico</div>
      <div class="nav-item" id="nav-dimensoes" onclick="go('dimensoes')"><span class="nav-icon">📦</span>Dimensões</div>
      <div class="nav-item" id="nav-logs" onclick="go('logs')"><span class="nav-icon">🔍</span>Logs</div>
    </nav>
    <!-- footer removido — sem login -->
  </div>

  <div id="main">
    <div class="topbar">
      <button id="menu-btn" onclick="toggleSb()">☰</button>
      <div style="flex:1;min-width:0">
        <h1 id="pg-title">Cotar Frete</h1>
        <div class="topbar-sub" id="pg-sub">Comparativo entre transportadoras</div>
      </div>
      <div id="mes-filtro-wrap" class="hidden" style="display:flex;align-items:center;gap:8px;flex-shrink:0">
        <span style="font-size:11px;color:var(--muted);white-space:nowrap">📅 Mês</span>
        <input type="month" id="mes-global" 
          style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--text);outline:none;cursor:pointer"
          onchange="aplicarMesGlobal()"/>
      </div>
    </div>
    <div class="page" id="pg"></div>
  </div>
</div>

<div id="toasts"></div>

<script>
const SB   = 'https://vishxwdxqiygbxmtpfoy.supabase.co';
const KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpc2h4d2R4cWl5Z2J4bXRwZm95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0Njg2MjIsImV4cCI6MjA4ODA0NDYyMn0.J647m3ieDHahNQYBWMRESl0aPFXsT_zt_7ZcDvyB-SA';
const EDGE = SB+'/functions/v1';
let user='', locais=[];

// Mês global — compartilhado entre auditoria, histórico e logs
const now = new Date();
let mesGlobal = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

function iniciarMesGlobal(){
  const el=document.getElementById('mes-global');
  if(el) el.value=mesGlobal;
}
function aplicarMesGlobal(){
  const el=document.getElementById('mes-global');
  if(!el) return;
  mesGlobal=el.value;
  // reaplica na página atual
  const titulo=document.getElementById('pg-title')?.textContent||'';
  if(titulo.includes('Auditoria')) filtCTE();
  else if(titulo.includes('Histórico')) pgHistorico();
  else if(titulo.includes('Logs')) pgLogs();
}

// Páginas que usam filtro de mês global
const PAGES_COM_MES=['auditoria','conferencia','historico','logs'];

// ── UTILS ──
function hdrs(){return{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'}}
async function db(path,opts={}){
  const url=`${SB}/rest/v1/${path}${path.includes('?')?'&':'?'}limit=9999`;
  let r;
  try{
    r=await fetch(url,{headers:hdrs(),...opts});
  }catch(netErr){
    // erro de rede — sem resposta do servidor
    const msg=`Erro de rede: ${netErr.message}`;
    bononiLog('ERRO','ERRO_QUERY',{modulo:'banco',erro:netErr,contexto:{query:path.split('?')[0]}});
    throw new Error(msg);
  }
  if(!r.ok){
    const body=await r.text();
    const msg=`[${r.status}] ${body.slice(0,300)}`;
    // loga automaticamente todo erro de banco com query e status
    bononiLog('ERRO','ERRO_QUERY',{modulo:'banco',
      
      contexto:{
        tabela: path.split('?')[0],
        status: r.status,
        erro:   body.slice(0,500),
        metodo: opts.method||'GET',
      }
    });
    throw new Error(msg);
  }
  return r.json();
}
const R=v=>v==null?'—':Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const N=v=>v==null?'—':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2});
// date-only ('2026-07-10') é parseado como local — evita bug de -1 dia no iOS
const D=d=>{if(!d)return'—';const s=String(d).slice(0,10).split('-');return s.length===3?`${s[2]}/${s[1]}/${s[0]}`:new Date(d).toLocaleDateString('pt-BR')};
const DT=d=>d?new Date(d).toLocaleString('pt-BR'):'—';

const _LOG_TABLE = 'frt_logs';

async function bononiLog(tipo, acao, dados = {}) {
  try {
    await fetch(`${SB}/rest/v1/${_LOG_TABLE}`, {
      method: 'POST',
      headers: {...hdrs(), 'Prefer': 'return=minimal'},

        contexto:       dados.contexto       || null,
        url:            window.location.href,
        user_agent:     navigator.userAgent
      })
    });

}

      <button class="btn btn-ghost" id="_cn">Cancelar</button>

// Cache de produtos — carrega 1x e filtra local
let _prodCache=null;
let _prodOcultos=0;
async function carregarProdutos(){
  if(_prodCache) return _prodCache;
  const [cat,dim]=await Promise.all([
    db('frt_catalogo_produtos?select=id,nome,referencia,peso_kg,altura_cm,largura_cm,comprimento_cm&ativo=eq.true&order=nome').catch(()=>[]),
    db('frt_produtos_dimensoes?select=id,id_produto,descricao,referencia,peso_kg,altura_cm,largura_cm,comprimento_cm&ativo=eq.true&order=descricao').catch(()=>[])
  ]);
  const todos=[
    ...cat.map(p=>({...p,_src:'catalogo'})),
    ...dim.filter(d=>!cat.find(c=>c.referencia===d.referencia)).map(p=>({...p,nome:p.descricao,_src:'dim'}))
  ];
  // esconde quem não tem medidas completas — não dá pra cotar
  _prodCache=todos.filter(medidasCompletas);
  _prodOcultos=todos.length-_prodCache.length;
  return _prodCache;
}

function mCEP(el){
  let v=el.value.replace(/\D/g,'');
  if(v.length>5)v=v.slice(0,5)+'-'+v.slice(5,8);
  el.value=v;
  const d=v.replace(/\D/g,'');
  const lbl=document.getElementById('cep-cidade');
  if(!lbl)return;
  if(d.length===8){lbl.style.color='var(--muted)';lbl.textContent='Buscando cidade...';buscarCidadeCep(d,lbl)}
  else{lbl.textContent=''}
}
let _cepCidadeCache={};
async function buscarCidadeCep(cep,lbl){
  if(_cepCidadeCache[cep]){lbl.style.color='var(--muted)';lbl.textContent=_cepCidadeCache[cep];return}
  try{
    const r=await fetch(`https://viacep.com.br/ws/${cep}/json/`);
    const d=await r.json();
    if(d.erro){lbl.style.color='var(--red)';lbl.textContent='CEP não encontrado';return}
    const txt=`${d.localidade} / ${d.uf}`;
    _cepCidadeCache[cep]=txt;
    lbl.style.color='var(--muted)';lbl.textContent=txt;
  }catch{lbl.textContent=''}
}
// Máscara unificada CPF (PF) ou CNPJ (PJ) — detecta pelo tamanho
function mDocDest(el){
  let v=el.value.replace(/\D/g,'').slice(0,14);
  const badge=document.getElementById('badge-pf-pj');
  const digits=v.length;
  // decide se é CPF ou CNPJ pelo que já foi digitado
  // Se ≤11 dígitos mantém como CPF; se >11 trata como CNPJ
  const isPF=digits<=11&&(digits<12);
  if(isPF){
    // máscara CPF: 000.000.000-00
    if(v.length>9)       v=v.slice(0,3)+'.'+v.slice(3,6)+'.'+v.slice(6,9)+'-'+v.slice(9,11);
    else if(v.length>6)  v=v.slice(0,3)+'.'+v.slice(3,6)+'.'+v.slice(6);
    else if(v.length>3)  v=v.slice(0,3)+'.'+v.slice(3);
    el.maxLength=14; // 000.000.000-00
    if(badge){
      if(digits===11) badge.innerHTML='<span class="badge b-purple">👤 Pessoa Física</span>';
      else badge.innerHTML='';
    }
  }else{
    // máscara CNPJ: 00.000.000/0000-00
    if(v.length>12)      v=v.slice(0,2)+'.'+v.slice(2,5)+'.'+v.slice(5,8)+'/'+v.slice(8,12)+'-'+v.slice(12);
    else if(v.length>8)  v=v.slice(0,2)+'.'+v.slice(2,5)+'.'+v.slice(5,8)+'/'+v.slice(8);
    else if(v.length>5)  v=v.slice(0,2)+'.'+v.slice(2,5)+'.'+v.slice(5);
    else if(v.length>2)  v=v.slice(0,2)+'.'+v.slice(2);
    el.maxLength=18; // 00.000.000/0000-00
    if(badge){
      if(digits===14) badge.innerHTML='<span class="badge b-blue">🏢 Pessoa Jurídica</span>';
      else badge.innerHTML='';
    }
  }
  el.value=v;
}

// ── Tradução de erros técnicos para linguagem clara ──
function msgErroFrete(raw){
  let txt=String(raw||'').trim();
  // extrai a mensagem de dentro de um JSON, se vier assim
  const m=txt.match(/\{[\s\S]*\}/);
  if(m){
    try{
      const j=JSON.parse(m[0]);
      txt=j.erro||j.error||j.message||j.mensagem||j.msg||txt;
      if(typeof txt==='object')txt=JSON.stringify(txt);
    }catch(_){}
  }
  const t=txt.toLowerCase();
  const R=(titulo,detalhe)=>({titulo,detalhe,tecnico:String(raw||'').slice(0,300)});
  if(/cep.*(nao|não).*(encontrad|localizad)|(nao|não).*(encontrad).*cep|cep inv[aá]lid/.test(t))
    return R('CEP não encontrado','Confira o CEP digitado — ele não existe na base dos Correios.');
  if(/fora da malha|sem cobertura|(nao|não) atend|sem atendimento|localidade (nao|não)|praça (nao|não)|rota (nao|não)/.test(t))
    return R('CEP fora da malha','A transportadora não atende esta região.');
  if(/timeout|timed out|aborted|etimedout|demorou/.test(t))
    return R('Transportadora não respondeu','A API demorou demais para responder. Tente cotar de novo.');
  if(/401|403|unauthorized|forbidden|credencial|token|autentica/.test(t))
    return R('Falha de acesso à transportadora','Credencial inválida ou expirada — precisa renovar o acesso.');
  if(/tabela|de-para|praça|praca|(nao|não) cadastrad|sem tabela/.test(t))
    return R('Sem tabela de preço','Esta transportadora não tem tabela cadastrada para o destino.');
  if(/peso|cubag|dimens|volume|medida/.test(t))
    return R('Problema com peso ou medidas',txt);
  if(/http 5\d\d|500|502|503|504|instabil|indispon[ií]vel/.test(t))
    return R('Transportadora indisponível','A API da transportadora está fora do ar no momento.');
  if(/failed to fetch|network|net::/.test(t))
    return R('Sem conexão','Não foi possível falar com o servidor. Verifique a internet.');
  if(/cnpj|cpf|documento/.test(t))
    return R('Documento do destinatário inválido',txt);
  if(/valor.*(nf|mercadoria)/.test(t))
    return R('Valor da NF inválido',txt);
  return R('Não foi possível cotar',txt||'Erro desconhecido.');
}

async function cotar(){
  const id_local=parseInt(document.getElementById('id_local')?.value);
  const cep=(document.getElementById('cep')?.value||'').replace(/\D/g,'');
  const cnpj=(document.getElementById('cnpj')?.value||'').replace(/\D/g,'');
  const valor_nf=parseFloat(document.getElementById('vnf')?.value)||0;
  if(!cep||cep.length<8){toast('Informe o CEP destino','error');return}
  // valida tamanho do documento se informado
  if(cnpj&&cnpj.length!==11&&cnpj.length!==14){toast('CPF deve ter 11 dígitos ou CNPJ 14 dígitos','error');return}
  const tipo_dest=cnpj.length===11?'PF':cnpj.length===14?'PJ':null;
  const pacotes=volumes.map(v=>({
    quantidade:v.quantidade,peso_kg:v.peso_kg,
    altura_cm:v.altura_cm,largura_cm:v.largura_cm,comprimento_cm:v.comprimento_cm
  }));
  if(!pacotes.length){toast('Adicione ao menos um volume','error');return}
  if(pacotes.some(p=>p.peso_kg<=0)){toast('Há volume sem peso informado','error');return}
  const rd=document.getElementById('result');
  rd.innerHTML=`<div class="loading"><div class="spinner"></div>Consultando transportadoras...</div>`;
  rd.scrollIntoView({behavior:'smooth',block:'nearest'});
  try{
    const r=await fetch(`${EDGE}/cotar-frete-index`,{method:'POST',
      headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':`Bearer ${KEY}`},
      body:JSON.stringify({id_local,cep_destino:cep,cnpj_destinatario:cnpj||undefined,tipo_destinatario:tipo_dest,valor_nf,pacotes})});
    if(!r.ok)throw new Error(`HTTP ${r.status}: ${(await r.text()).slice(0,300)}`);
    // Trata resposta NDJSON (streaming) ou JSON normal
    const txt=await r.text();
    let data;
    try{data=JSON.parse(txt)}catch{
      // NDJSON: cada linha é um JSON separado
      const lines=txt.split('\n').filter(l=>l.trim());
      const chunks=lines.map(l=>{try{return JSON.parse(l)}catch{return null}}).filter(Boolean);
      const resultados=[];let meta={};
      for(const c of chunks){
        if(c.transportadora) resultados.push(c);
        else Object.assign(meta,c);
      }
      data={...meta,resultados};
    }
    bononiLog('ACAO','COTACAO_REALIZADA',{modulo:'cotacao',contexto:{cep,tipo_dest,volumes:pacotes.length,resultados:data?.resultados?.length}});
    renderResult(data,rd,tipo_dest);
    // A Edge Function cotar-frete-index já grava a cotação (frt_cotacoes + pacotes + respostas).
    // NÃO gravar de novo aqui — o salvarCotacao antigo criava uma cotação duplicada e vazia.
  }catch(e){
    bononiLog('ERRO','ERRO_COTACAO',{modulo:'cotacao',erro:e,contexto:{cep}});
    const em=msgErroFrete(e.message);
    rd.innerHTML=`<div class="card err-box">
      <div class="err-ic">⚠️</div>
      <div style="flex:1">
        <div class="err-tit">${em.titulo}</div>
        <div class="err-det">${em.detalhe}</div>
        <details class="err-tec"><summary>Detalhe técnico</summary><code>${em.tecnico.replace(/</g,'&lt;')}</code></details>
      </div>
    </div>`;
    toast(em.titulo,'error');
  }
}
async function salvarCotacao({id_local,cep,cnpj,tipo_dest,valor_nf,pacotes,data}){
  try{
    // 1. Salvar cotação principal
    const cotacao={
      id_local,
      cep_destino:cep,
      cidade_destino:data?.cidade_destino||null,
      uf_destino:data?.uf_destino||null,
      valor_nf:valor_nf||0,
      peso_total_kg:data?.peso_total_kg||null,
      criado_por:user||'Usuário'
    };
    const rCot=await fetch(`${SB}/rest/v1/frt_cotacoes`,{
      method:'POST',headers:{...hdrs(),'Prefer':'return=representation'},
      body:JSON.stringify(cotacao)
    });
    if(!rCot.ok) throw new Error(`Cotação: HTTP ${rCot.status}`);
    const [saved]=await rCot.json();
    if(!saved?.id) return;

    // 2. Salvar respostas das transportadoras
    const respostas=(data?.resultados||[]).map(r=>({
      id_cotacao:saved.id,
      transportadora:r.transportadora||'—',
      valor_frete:r.valor_frete||null,
      valor_total:r.valor_total??r.valor_frete??null,
      prazo_dias:r.prazo_dias||null,
      erro:r.erro||null
    }));
    if(respostas.length){
      await fetch(`${SB}/rest/v1/frt_cotacoes_respostas`,{
        method:'POST',headers:{...hdrs(),'Prefer':'return=minimal'},
        body:JSON.stringify(respostas)
      });
    }
  }catch(e){
    bononiLog('ERRO','ERRO_SALVAR_COTACAO',{modulo:'cotacao',erro:e});
  }
}

function renderResult(data,c,tipo_dest){
  const res=data?.resultados||[];
  if(!res.length){c.innerHTML=`<div class="card"><div class="empty"><div class="ei">🔍</div><p>Nenhuma cotação retornada.<br>Verifique o CEP e local de expedição.</p></div></div>`;return}
  // valor_total pode não vir no stream NDJSON — fallback pro valor_frete
  const vTot=r=>Number(r.valor_total??r.valor_frete)||0;
  const ok=res.filter(r=>!r.erro).sort((a,b)=>vTot(a)-vTot(b));
  const er=res.filter(r=>r.erro);
  let html=`<div class="card"><div class="flex jb ac mb-2" style="flex-wrap:wrap;gap:8px"><div class="card-title" style="margin:0">🏆 Cotações</div>${data.codigo?`<span class="tag">🔖 ${data.codigo}${data.id_cotacao?' · ID '+data.id_cotacao:''}</span>`:''}</div>`;
  const _cid=data.cidade||data.cidade_destino, _uf=data.uf||data.uf_destino, _pt=data.peso_taxado??data.peso_total_kg;
  if(_cid||_uf)
    html+=`<div class="mb-3"><span class="tag">📍 ${_cid||''}${_uf?' / '+_uf:''}</span>${_pt?`<span class="tag">⚖️ ${N(_pt)} kg</span>`:''}${tipo_dest?`<span class="tag">👤 ${tipo_dest==='PF'?'Pessoa Física':'Pessoa Jurídica'}</span>`:''}</div>`;
  html+=`<div class="result-grid">`;
  [...ok,...er].forEach((r,i)=>{
    if(r.erro){
      const em=msgErroFrete(r.erro);
      html+=`<div class="r-card r-error">
        <div class="r-transp">${r.transportadora||'—'}</div>
        <div class="r-preco">${em.titulo}</div>
        <div class="r-detail">${em.detalhe}</div>
        <details class="err-tec"><summary>Detalhe técnico</summary><code>${em.tecnico.replace(/</g,'&lt;')}</code></details>
      </div>`;return}
    const w=i===0;
    html+=`<div class="r-card${w?' winner':''}">
      ${w?'<span class="r-winner-badge">✅ Menor Preço</span>':''}
      <div class="r-transp">${r.transportadora}</div>
      <div class="r-prazo">⏱️ ${r.prazo_dias??'?'} dia(s) úteis</div>
      <div class="r-preco">${R(vTot(r))}</div>
      ${r.valor_total&&r.valor_frete&&Number(r.valor_total)!==Number(r.valor_frete)?`<div class="r-detail">Frete: ${R(r.valor_frete)}</div>`:''}
      ${r.valor_pedagio?`<div class="r-detail">Pedágio: ${R(r.valor_pedagio)}</div>`:''}
      ${r.valor_gris?`<div class="r-detail">GRIS: ${R(r.valor_gris)}</div>`:''}
      ${r.id_cotacao?`<div class="r-detail" style="font-size:10.5px;color:var(--muted)">Protocolo: ${r.id_cotacao}</div>`:''}
    </div>`;
  });
  html+=`</div></div>`;c.innerHTML=html;
}

function filtrarCtesDados(ctes,mes,st,q){
  return ctes.filter(r=>{
    const dataCte=r.data_emissao||r.criado_em||'';
    const matchMes=!mes||dataCte.startsWith(mes);
    const matchSt=!st||r.status_auditoria===st;
    const qq=q.toLowerCase();
    const matchQ=!qq||(r.nome_transportadora||'').toLowerCase().includes(qq)||(r.nome_destinatario||'').toLowerCase().includes(qq)||(r.num_cte||'').includes(qq);
    return matchMes&&matchSt&&matchQ;
  });
}

function sortCTE(col){
  const prev=auditSort;
  auditSort={col,dir:prev.col===col&&prev.dir==='asc'?'desc':'asc'};
  // atualiza ícones
  document.querySelectorAll('[id^="sh-"]').forEach(el=>el.textContent='');
  const sh=document.getElementById(`sh-${col}`);
  if(sh)sh.textContent=auditSort.dir==='asc'?'↑':'↓';
  filtCTE();
}

function filtCTE(){
  const c=document.getElementById('pg'),ctes=c.__ctes||[];
  const st=document.getElementById('fst')?.value||'';
  const q=document.getElementById('ftr')?.value||'';
  let f=filtrarCtesDados(ctes,mesGlobal,st,q);
  const{col,dir}=auditSort;
  f=[...f].sort((a,b)=>{
    let va=a[col]??'',vb=b[col]??'';
    const na=parseFloat(va),nb=parseFloat(vb);
    if(!isNaN(na)&&!isNaN(nb)){va=na;vb=nb;}
    if(va<vb)return dir==='asc'?-1:1;
    if(va>vb)return dir==='asc'?1:-1;
    return 0;
  });
  const tb=document.getElementById('cte-tb');
  if(tb)tb.innerHTML=renderCTEdesk(f);
}

async function updCTE(id,val,campo){
  try{
    const body=campo==='status'?{status_auditoria:val,atualizado_em:new Date().toISOString()}:{observacao_auditoria:val,atualizado_em:new Date().toISOString()};
    const r=await fetch(`${SB}/rest/v1/frt_conhecimentos?id=eq.${id}`,{method:'PATCH',headers:{...hdrs(),'Prefer':'return=minimal'},body:JSON.stringify(body)});
    if(!r.ok)throw new Error(`[${r.status}] ${(await r.text()).slice(0,200)}`);
    bononiLog('ACAO',campo==='status'?'ALTERAR_STATUS':'ALTERAR_OBS',{modulo:'auditoria',entidade:'cte',id_entidade:id,depois:{[campo]:val}});
    toast(campo==='status'?`Status: ${val}`:'Observação salva','success');
    const c=document.getElementById('pg');if(c.__ctes){const x=c.__ctes.find(x=>x.id===id);if(x){if(campo==='status')x.status_auditoria=val;else x.observacao_auditoria=val;}}
  }catch(e){
    bononiLog('ERRO','ERRO_ATUALIZAR_CTE',{modulo:'auditoria',entidade:'cte',id_entidade:id,erro:e,contexto:{campo,val}});
    toast('Erro: '+e.message,'error');
  }
}

            <select class="fi" id="cf-transp" onchange="confSet('transp',this.value)" style="flex:0 0 auto;min-width:150px">

            </select>
            <select class="fi" id="cf-status" onchange="confSet('status',this.value)" style="flex:0 0 auto;min-width:120px">
              <option value="">Todos</option>
              <option value="a_lancar">A lançar</option>
              <option value="lancado">Lançados</option>
            </select>
            <input class="fi" id="cf-q" placeholder="CTe, NF, cliente..." oninput="confSet('q',this.value)"/>
          </div>
        </div>
        <div id="conf-groups"></div>
      </div>`;
    aplicarConf();
    pintarFaturas();
  }catch(e){
    bononiLog('ERRO','ERRO_CONFERENCIA',{modulo:'conferencia',erro:e});
    c.innerHTML=`<div class="empty"><div class="ei">❌</div><p>${e.message}</p></div>`;
    toast('Erro: '+e.message,'error');

}

function confSet(k,v){confFiltro[k]=v;aplicarConf();}

function confNFs(r){return((r.notas_fiscais||[]).map(n=>n&&n.num_nf).filter(Boolean).join(', '))||'—';}
function fmtVenc(iso){return iso?String(iso).slice(0,10).split('-').reverse().join('/'):'—';}
function vencCls(iso){
  if(!iso)return 'b-gray';
  const hoje=new Date();hoje.setHours(0,0,0,0);
  const dias=Math.round((new Date(iso+'T00:00:00')-hoje)/86400000);
  if(dias<0)return 'b-red';        // vencido
  if(dias<=5)return 'b-warn';      // vence já
  return 'b-ok';
}
function transpCurto(n){n=(n||'').toUpperCase();if(n.includes('MIGUEL'))return 'São Miguel';if(n.includes('RODONAVES')||n.includes('RTE'))return 'Rodonaves';if(n.includes('BRASPRESS'))return 'Braspress';return (n.split(' ')[0]||'—');}
const EMP_CNPJ={"57129987000166":1,"05864790000177":2,"05864790000258":3,"05864790000339":4,"73403826000175":5,"51054503000180":6,"15090647000200":8,"15090647000119":7,"15090647000129":7};
function saoMiguel(r){return (r.nome_transportadora||'').toUpperCase().includes('MIGUEL');}
function empresaCte(r){
  const ch=r.notas_fiscais&&r.notas_fiscais[0]&&r.notas_fiscais[0].chave_nfe;
  if(!ch||String(ch).length<20)return null;
  return EMP_CNPJ[String(ch).substring(6,20)]??null;
}
function pintarFaturas(){
  const c=document.getElementById('pg'),box=document.getElementById('conf-faturas');
  if(box)box.innerHTML=renderFaturasPanel(c.__faturas||[],c.__conf||[]);
}
function renderFaturasPanel(faturas,ctes){
  // só faturas com dado de verdade (vencimento captado)
  faturas=(faturas||[]).filter(f=>f.vencimento);
  if(!faturas.length)return '';
  const soma=faturas.reduce((s,f)=>s+Number(f.valor_total||0),0);
  const hoje=new Date();hoje.setHours(0,0,0,0);
  const aVencer=faturas.filter(f=>f.vencimento&&new Date(f.vencimento+'T00:00:00')>=hoje).length;
  const vinc={};(ctes||[]).forEach(r=>{if(r.num_fatura)vinc[r.num_fatura]=(vinc[r.num_fatura]||0)+1;});
  const rows=faturas.slice(0,120).map(f=>{
    const sm=(f.transportadora||'').toUpperCase().includes('MIGUEL');
    const n=vinc[f.num_fatura]||0;
    const acao=sm
      ?`<button class="btn btn-ghost btn-sm" onclick="abrirVincular('${(f.num_fatura||'').replace(/'/g,'')}')">${n?('✓ '+n+' CTe'+(n>1?'s':'')):'Vincular CTes'}</button>`
      :`<span class="faint" style="font-size:11px">manual</span>`;
    return `<tr>
     <td>${transpCurto(f.transportadora)}</td>
     <td>${f.empresa||'—'}</td>
     <td class="mono">${f.num_fatura||'—'}</td>
     <td class="mono"><span class="badge ${vencCls(f.vencimento)}">${fmtVenc(f.vencimento)}</span></td>
     <td class="mono" style="text-align:right;white-space:nowrap">${R(f.valor_total)}</td>
     <td style="text-align:right">${acao}</td>
   </tr>`;}).join('');
  return `<div class="card">
    <div class="flex jb ac mb-3" style="flex-wrap:wrap;gap:8px">
      <div class="card-title" style="margin:0">📅 Faturas de frete — vencimentos <span class="badge b-blue">${faturas.length}</span></div>
      <div class="faint" style="font-size:12px">Captadas do e-mail · total ${R(soma)} · ${aVencer} a vencer</div>
    </div>
    <div class="faint" style="font-size:12px;margin-bottom:8px">Só o <b>São Miguel</b> traz o vencimento por e-mail. Clique em <b>Vincular CTes</b> pra amarrar a fatura aos CTes — o vencimento cola em cada um.</div>
    <div class="table-wrap" style="max-height:300px;overflow-y:auto">
      <table>
        <thead><tr><th>Transp.</th><th>Empresa</th><th>Fatura</th><th>Vencimento</th><th style="text-align:right">Valor</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>`;
}

// ---- Vínculo assistido: fatura São Miguel -> CTes ----
let _vinc=null;
function vincVal(r){return Number(r.valor_total_cte||r.valor_frete_cte||0);}
function abrirVincular(numFatura){
  const c=document.getElementById('pg');
  const f=(c.__faturas||[]).find(x=>String(x.num_fatura)===String(numFatura)&&(x.transportadora||'').toUpperCase().includes('MIGUEL'));
  if(!f){toast('Fatura não encontrada','error');return;}
  // janela: CTes emitidos até ~70 dias antes do vencimento (a fatura fecha antes de vencer)
  const vd=f.vencimento?new Date(f.vencimento+'T00:00:00'):null;
  const ini=vd?new Date(vd.getTime()-70*86400000):null, fim=vd?new Date(vd.getTime()+5*86400000):null;
  const cand=(c.__conf||[]).filter(r=>{
    if(!saoMiguel(r)||empresaCte(r)!==f.id_empresa)return false;
    if(r.num_fatura&&String(r.num_fatura)!==String(f.num_fatura))return false;
    if(vd&&r.data_emissao){const d=new Date(String(r.data_emissao).slice(0,10)+'T00:00:00');if(d<ini||d>fim)return false;}
    return true;
  }).sort((a,b)=>String(a.data_emissao||'').localeCompare(String(b.data_emissao||'')));
  const sel=new Set(cand.filter(r=>String(r.num_fatura)===String(f.num_fatura)).map(r=>r.id));
  _vinc={f,cand,sel};
  pintarModal();
}
function pintarModal(){
  const {f,cand,sel}=_vinc;
  const total=Number(f.valor_total||0);
  const somaSel=cand.filter(r=>sel.has(r.id)).reduce((s,r)=>s+vincVal(r),0);
  const bate=Math.abs(somaSel-total)<0.01;
  let m=document.getElementById('conf-modal');
  if(!m){m=document.createElement('div');m.id='conf-modal';document.body.appendChild(m);}
  m.setAttribute('style','position:fixed;inset:0;background:rgba(8,15,30,.55);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px');
  const linhas=cand.map(r=>{
    const on=sel.has(r.id);
    return `<tr onclick="vincToggle('${r.id}')" style="cursor:pointer;${on?'background:var(--blue-pale)':''}">
      <td style="text-align:center"><input type="checkbox" ${on?'checked':''} onclick="event.stopPropagation();vincToggle('${r.id}')" style="width:16px;height:16px"/></td>
      <td class="mono">${r.num_cte||'—'}</td>
      <td>${(r.data_emissao||'').slice(0,10).split('-').reverse().join('/')}</td>
      <td class="mono">${confNFs(r)}</td>
      <td>${r.nome_destinatario||'—'}</td>
      <td class="mono" style="text-align:right">${R(vincVal(r))}</td>
    </tr>`;}).join('')||`<tr><td colspan="6" style="text-align:center;padding:20px;color:var(--muted)">Nenhum CTe do São Miguel dessa empresa disponível.</td></tr>`;
  m.innerHTML=`<div class="card" style="max-width:760px;width:100%;max-height:88vh;overflow:auto;margin:0">
    <div class="flex jb ac mb-3" style="gap:8px">
      <div class="card-title" style="margin:0">Vincular fatura ${f.num_fatura} <span class="faint" style="font-weight:400">${f.empresa||''} · vence ${fmtVenc(f.vencimento)}</span></div>
      <button class="btn btn-ghost btn-sm" onclick="fecharModal()">✕</button>
    </div>
    <div class="faint" style="font-size:12px;margin-bottom:8px">Marque os CTes desta fatura. O total é <b>referência</b> (a fatura inclui impostos/ajustes — pode não bater exato). Ao vincular, o vencimento <b>${fmtVenc(f.vencimento)}</b> cola em cada CTe.${f.link_fatura?` · <a href="${f.link_fatura}" target="_blank" rel="noopener" style="color:var(--accent)">abrir fatura no portal ↗</a> (confere a lista oficial de CTes)`:''}</div>
    <div class="table-wrap" style="max-height:46vh;overflow:auto">
      <table><thead><tr><th style="width:34px"></th><th>CTe</th><th>Data</th><th>NF</th><th>Cliente</th><th style="text-align:right">Valor</th></tr></thead>
      <tbody>${linhas}</tbody></table>
    </div>
    <div class="flex jb ac" style="gap:10px;flex-wrap:wrap;margin-top:12px">
      <div style="font-size:13px">Selecionado <b class="mono">${R(somaSel)}</b> / total <b class="mono">${R(total)}</b>
        <span class="badge ${bate?'b-ok':'b-warn'}" style="margin-left:6px">${bate?'bate ✓':'dif. '+R(Math.abs(somaSel-total))}</span></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost btn-sm" onclick="vincSugerir()">Sugerir seleção</button>
        <button class="btn btn-sm" style="background:var(--accent);color:#fff;border:none" onclick="vincSalvar()">Vincular ${sel.size} CTe(s)</button>
      </div>
    </div>
  </div>`;
}
function vincToggle(id){if(_vinc.sel.has(id))_vinc.sel.delete(id);else _vinc.sel.add(id);pintarModal();}
function vincSugerir(){
  const {f,cand}=_vinc,total=Number(f.valor_total||0);
  const ord=[...cand].sort((a,b)=>vincVal(b)-vincVal(a));
  const sel=new Set();let s=0;
  for(const r of ord){const v=vincVal(r);if(s+v<=total+0.005){sel.add(r.id);s+=v;}}
  _vinc.sel=sel;pintarModal();
}
function fecharModal(){const m=document.getElementById('conf-modal');if(m)m.remove();_vinc=null;}
async function vincSalvar(){
  const {f,cand,sel}=_vinc,venc=f.vencimento,upd=[];
  for(const r of cand){
    const quer=sel.has(r.id),ja=String(r.num_fatura)===String(f.num_fatura);
    if(quer&&!ja)upd.push({r,body:{id_fatura:f.id||null,num_fatura:f.num_fatura,frete_vencimento:venc}});
    else if(!quer&&ja)upd.push({r,body:{id_fatura:null,num_fatura:null,frete_vencimento:null}});
  }
  if(!upd.length){toast('Nada mudou','info');fecharModal();return;}
  try{
    await Promise.all(upd.map(u=>fetch(`${SB}/rest/v1/frt_conhecimentos?id=eq.${u.r.id}`,{method:'PATCH',headers:{...hdrs(),'Prefer':'return=minimal'},body:JSON.stringify(u.body)})));
    upd.forEach(u=>Object.assign(u.r,u.body));
    if(f.id)await fetch(`${SB}/rest/v1/frt_faturas?id=eq.${f.id}`,{method:'PATCH',headers:{...hdrs(),'Prefer':'return=minimal'},body:JSON.stringify({status:'conferida'})}).catch(()=>{});
    f.status='conferida';
    toast(`${upd.length} CTe(s) · vencimento ${fmtVenc(venc)}`,'success');
    fecharModal();aplicarConf();pintarFaturas();
  }catch(e){
    bononiLog('ERRO','ERRO_VINCULAR_FATURA',{modulo:'conferencia',erro:e,contexto:{fatura:f.num_fatura}});
    toast('Erro ao vincular: '+e.message,'error');
  }
}

function confFiltrar(){
  const c=document.getElementById('pg'),ctes=c.__conf||[];
  const{transp,status,q}=confFiltro,qq=(q||'').toLowerCase();
  return ctes.filter(r=>{
    if(!(r.data_emissao||r.criado_em||'').startsWith(mesGlobal))return false;
    if(transp&&r.nome_transportadora!==transp)return false;
    if(status==='a_lancar'&&r.frete_lancado)return false;
    if(status==='lancado'&&!r.frete_lancado)return false;
    if(qq){
      const alvo=`${r.num_cte||''} ${confNFs(r)} ${r.nome_destinatario||''} ${r.nome_vendedor||''}`.toLowerCase();
      if(!alvo.includes(qq))return false;
    }
    return true;
  });
}

function aplicarConf(){
  const f=confFiltrar();
  // stats
  const aLancar=f.filter(x=>!x.frete_lancado),lancados=f.filter(x=>x.frete_lancado);
  const vlAlancar=aLancar.reduce((s,x)=>s+Number(x.valor_total_cte||x.valor_frete_cte||0),0);
  const st=document.getElementById('conf-stats');
  if(st)st.innerHTML=`
    <div class="stat c-blue"><div class="stat-lbl">CTes no mês</div><div class="stat-val">${f.length}</div></div>
    <div class="stat c-warn"><div class="stat-lbl">A lançar</div><div class="stat-val">${aLancar.length}</div></div>
    <div class="stat c-green"><div class="stat-lbl">Lançados</div><div class="stat-val">${lancados.length}</div></div>
    <div class="stat c-red"><div class="stat-lbl">R$ a lançar</div><div class="stat-val" style="font-size:18px">${R(vlAlancar)}</div></div>`;
  // agrupa por transportadora
  const g={};
  f.forEach(r=>{const k=r.nome_transportadora||'(sem transportadora)';(g[k]=g[k]||[]).push(r);});
  const box=document.getElementById('conf-groups');
  if(!box)return;
  const chaves=Object.keys(g).sort();
  if(!chaves.length){box.innerHTML=`<div class="empty"><div class="ei">✅</div><p>Nada a conferir neste filtro.</p></div>`;return;}
  box.innerHTML=chaves.map(k=>{
    const rows=g[k];
    const pend=rows.filter(x=>!x.frete_lancado);
    const somaP=pend.reduce((s,x)=>s+Number(x.valor_total_cte||x.valor_frete_cte||0),0);
    return`
    <div style="margin-bottom:18px">
      <div class="flex jb ac" style="flex-wrap:wrap;gap:8px;margin-bottom:6px">
        <div style="font-weight:700;font-size:13.5px">${k}
          <span class="badge ${pend.length?'b-warn':'b-ok'}" style="margin-left:6px">${pend.length} a lançar</span>
          <span class="badge b-gray" style="margin-left:2px">${R(somaP)}</span>
        </div>
        ${pend.length?`<button class="btn btn-ghost btn-sm" onclick="confMarcarGrupo('${k.replace(/'/g,"\\'")}')">✓ Marcar grupo como lançado</button>`:''}
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th style="width:44px;text-align:center">Lançado</th>
            <th>CTe</th><th>Data</th><th>NF</th><th>Cliente</th><th>UF</th><th>Vendedor</th>
            <th>Venc.</th><th style="text-align:right">Vl. Frete</th>
          </tr></thead>
          <tbody>
            ${rows.map(r=>{
              const done=!!r.frete_lancado;
              return`<tr id="conf-${r.id}" style="${done?'opacity:.5':''}">
                <td style="text-align:center"><input type="checkbox" ${done?'checked':''} onchange="confToggle('${r.id}',this.checked)" style="width:17px;height:17px;cursor:pointer" title="${done?('Lançado '+DT(r.frete_lancado_em)):'Marcar como lançado'}"/></td>
                <td class="mono">${r.num_cte||'—'}</td>
                <td style="white-space:nowrap">${(r.data_emissao||r.criado_em||'').slice(0,10).split('-').reverse().join('/')||'—'}</td>
                <td class="mono">${confNFs(r)}</td>
                <td>${r.nome_destinatario||'—'}</td>
                <td>${r.uf_destino||'—'}</td>
                <td>${r.nome_vendedor||`<span class="badge b-gray">sem vínculo</span>`}</td>
                <td class="mono">${r.frete_vencimento?`<span class="badge ${vencCls(r.frete_vencimento)}">${fmtVenc(r.frete_vencimento)}</span>`:'<span class="faint">—</span>'}</td>
                <td class="mono" style="text-align:right;white-space:nowrap">${R(r.valor_total_cte||r.valor_frete_cte)}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
  }).join('');
}

async function confToggle(id,checked){
  const c=document.getElementById('pg'),item=(c.__conf||[]).find(x=>x.id==id);
  const body={frete_lancado:checked,frete_lancado_em:checked?new Date().toISOString():null,frete_lancado_por:checked?user:null};
  try{
    const r=await fetch(`${SB}/rest/v1/frt_conhecimentos?id=eq.${id}`,{method:'PATCH',headers:{...hdrs(),'Prefer':'return=minimal'},body:JSON.stringify(body)});
    if(!r.ok)throw new Error('HTTP '+r.status);
    if(item)Object.assign(item,body);
    aplicarConf();
    toast(checked?'CTe marcado como lançado':'Desmarcado','success');
  }catch(e){
    bononiLog('ERRO','ERRO_CONF_TOGGLE',{modulo:'conferencia',entidade:'cte',id_entidade:id,erro:e});
    toast('Erro ao salvar: '+e.message,'error');
    aplicarConf();
  }
}

async function confMarcarGrupo(transp){
  const c=document.getElementById('pg');
  const alvo=confFiltrar().filter(x=>x.nome_transportadora===transp&&!x.frete_lancado);
  if(!alvo.length)return;
  if(!confirm(`Marcar ${alvo.length} CTe(s) de ${transp} como lançados?`))return;
  const agora=new Date().toISOString();
  try{
    await Promise.all(alvo.map(x=>fetch(`${SB}/rest/v1/frt_conhecimentos?id=eq.${x.id}`,{method:'PATCH',headers:{...hdrs(),'Prefer':'return=minimal'},body:JSON.stringify({frete_lancado:true,frete_lancado_em:agora,frete_lancado_por:user})})));
    alvo.forEach(x=>{x.frete_lancado=true;x.frete_lancado_em=agora;x.frete_lancado_por=user;});
    aplicarConf();
    toast(`${alvo.length} CTe(s) marcados como lançados`,'success');
  }catch(e){
    bononiLog('ERRO','ERRO_CONF_GRUPO',{modulo:'conferencia',erro:e,contexto:{transp}});
    toast('Erro: '+e.message,'error');
  }
}

function filtrarPorMes(rows,campo,mes){
  if(!mes) return rows;
  return rows.filter(r=>(r[campo]||'').startsWith(mes));
}

function renderHistMob(rows,lm,rm){
  if(!rows.length)return`<div class="empty"><div class="ei">📭</div><p>Sem cotações</p></div>`;
  return rows.map(r=>{
    const res=(rm[r.id]||[]).filter(x=>x.valor_frete);
    const menor=res.sort((a,b)=>(a.valor_frete||0)-(b.valor_frete||0))[0];
    return`<div class="hist-card">
      <div class="hist-row"><span class="hist-lbl">Código</span><strong style="font-family:'DM Mono',monospace">${r.codigo||'—'}${r.id?` · ID ${r.id}`:''}</strong></div>
      <div class="hist-row"><span class="hist-lbl">Data</span><strong>${DT(r.criado_em)}</strong></div>
      <div class="hist-row"><span class="hist-lbl">Origem</span><span>${lm[r.id_local]||'—'}</span></div>
      <div class="hist-row"><span class="hist-lbl">Destino</span><span>${r.cidade_destino||r.cep_destino||'—'}${r.uf_destino?' / '+r.uf_destino:''}</span></div>
      <div class="hist-row"><span class="hist-lbl">Valor NF</span><span>${R(r.valor_nf)}</span></div>
      ${res.map(x=>{const v=x.valor_frete;const isMin=menor?.transportadora===x.transportadora;return`<div class="hist-row"><span class="hist-lbl">${x.transportadora}</span><span style="font-weight:${isMin?700:400};color:${isMin?'var(--green)':'inherit'}">${R(v)}${x.prazo_dias?' · '+x.prazo_dias+'d':''}${x.id_cotacao_ext?' · #'+x.id_cotacao_ext:''}</span></div>`}).join('')}
      ${(rm[r.id]||[]).filter(x=>x.erro&&!x.valor_frete).map(x=>`<div class="hist-row"><span class="hist-lbl">${x.transportadora}</span><span class="text-muted" style="font-size:11px">Indisp.</span></div>`).join('')}
      ${menor?`<div class="hist-row" style="border-top:1px solid var(--border);padding-top:6px;margin-top:4px"><span class="hist-lbl">✅ Menor</span><span style="color:var(--green);font-weight:700">${menor.transportadora} — ${R(menor.valor_frete)}</span></div>`:''}
      <div class="hist-row"><span class="hist-lbl">Usuário</span><span class="text-muted">${r.criado_por||'—'}</span></div>
    </div>`;
  }).join('');
}

function renderHistDesk(rows,lm,rm,transp){
  if(!rows.length)return`<tr><td colspan="${5+transp.length+2}"><div class="empty"><div class="ei">📭</div><p>Sem cotações</p></div></td></tr>`;
  return rows.map(r=>{
    const res=rm[r.id]||[];
    const byT={};res.forEach(x=>{byT[x.transportadora]=x});
    const ok=res.filter(x=>x.valor_frete).sort((a,b)=>(a.valor_frete||0)-(b.valor_frete||0));
    const menor=ok[0];
    return`<tr>
      <td style="white-space:nowrap;font-family:'DM Mono',monospace;font-size:12px">${r.codigo||'—'}${r.id?`<br><span style="font-size:10px;color:var(--muted)">ID ${r.id}</span>`:''}</td>
      <td style="white-space:nowrap">${DT(r.criado_em)}</td>
      <td>${lm[r.id_local]||'—'}</td>
      <td style="white-space:nowrap">${r.cidade_destino||r.cep_destino||'—'}${r.uf_destino?' / '+r.uf_destino:''}</td>
      <td style="white-space:nowrap">${R(r.valor_nf)}</td>
      ${transp.map(t=>{
        const x=byT[t];
        if(!x)return`<td style="text-align:center;color:var(--muted)">—</td>`;
        const v=x.valor_frete;
        if(!v)return`<td style="text-align:center;font-size:11px;color:var(--muted)">Indisp.</td>`;
        const isMin=menor?.transportadora===t;
        return`<td style="text-align:center;font-weight:${isMin?700:400};color:${isMin?'var(--green)':'inherit'}">
          ${R(v)}<br><span style="font-size:10px;color:var(--muted)">${x.prazo_dias?x.prazo_dias+'d':''}${x.id_cotacao_ext?'<br>#'+x.id_cotacao_ext:''}</span>
        </td>`;
      }).join('')}
      <td style="white-space:nowrap">${menor?`<span class="badge b-ok" style="font-size:11px">${menor.transportadora}</span>`:'—'}</td>
      <td class="text-muted" style="white-space:nowrap">${r.criado_por||'—'}</td>
    </tr>`;
  }).join('');
}

function filtHist(){
  const c=document.getElementById('pg');
  const rows=c.__hist||[],lm=c.__lm||{},rm=c.__rm||{},transp=c.__transp||[];
  const q=(document.getElementById('fh')?.value||'').toLowerCase();
  let f=filtrarPorMes(rows,'criado_em',mesGlobal);
  if(q) f=f.filter(r=>(r.cep_destino||'').includes(q)||(r.cidade_destino||'').toLowerCase().includes(q)||(r.criado_por||'').toLowerCase().includes(q));
  const mob=document.getElementById('hist-mob'),tb=document.getElementById('hist-tb');
  if(mob)mob.innerHTML=renderHistMob(f,lm,rm);
  if(tb)tb.innerHTML=renderHistDesk(f,lm,rm,transp);
}

// ────────────────────────────────────────────
// PAGE: DIMENSÕES DE PRODUTOS
// ────────────────────────────────────────────
let _editDimId=null;

function editDim(id){
  const c=document.getElementById('pg');
  const p=(c?.__dims||[]).find(x=>x.id===id);
  if(!p){toast('Produto não encontrado','error');return}
  _editDimId=id;
  const set=(el,v)=>{const e=document.getElementById(el);if(e)e.value=v??''};
  set('nd',p.descricao);set('nr',p.referencia);set('np',p.peso_kg);
  set('na',p.altura_cm);set('nl',p.largura_cm);set('nc',p.comprimento_cm);
  const t=document.getElementById('dim-form-title');if(t)t.textContent='✏️ Editando: '+(p.descricao||'');
  const b=document.getElementById('btn-salvar-dim');if(b)b.textContent='💾 Salvar alterações';
  const x=document.getElementById('btn-cancel-dim');if(x)x.style.display='';
  document.getElementById('card-dim-form')?.scrollIntoView({behavior:'smooth',block:'center'});
}

function cancelarEditDim(){
  _editDimId=null;
  ['nd','nr','np','na','nl','nc'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=''});
  const t=document.getElementById('dim-form-title');if(t)t.textContent='➕ Novo Cadastro Manual';
  const b=document.getElementById('btn-salvar-dim');if(b)b.textContent='💾 Salvar Dimensão';
  const x=document.getElementById('btn-cancel-dim');if(x)x.style.display='none';
}

async function pgDimensoes(){
  _editDimId=null;
  const c=document.getElementById('pg');
  c.innerHTML=`<div class="loading"><div class="spinner"></div>Carregando...</div>`;
  try{
    const [dims,cat]=await Promise.all([
      db('frt_produtos_dimensoes?select=*&ativo=eq.true&order=descricao'),
      db('frt_catalogo_produtos?select=id,nome,referencia,peso_kg,altura_cm,largura_cm,comprimento_cm,volume_m3&ativo=eq.true&order=nome')
    ]);
    c.__dims=dims;c.__cat=cat;
    c.innerHTML=`
      <div class="stats-grid" style="grid-template-columns:1fr 1fr 1fr">
        <div class="stat c-blue"><div class="stat-lbl">Portal Representantes</div><div class="stat-val">${cat.length}</div></div>
        <div class="stat c-green"><div class="stat-lbl">Cadastros Manuais</div><div class="stat-val">${dims.length}</div></div>
        <div class="stat c-warn"><div class="stat-lbl">Total disponível</div><div class="stat-val">${cat.length+dims.length}</div></div>
      </div>

      <div class="card" id="card-dim-form">
        <div class="card-title" id="dim-form-title">➕ Novo Cadastro Manual</div>
        <div class="grid g2">
          <div class="field full"><label>Descrição / Nome do produto</label><input id="nd" placeholder="Ex: Volante Esportivo 14 pol"/></div>
          <div class="field"><label>Referência</label><input id="nr" placeholder="Ex: VE-14"/></div>
          <div class="field"><label>Peso (kg)</label><input id="np" type="number" placeholder="0.000" step="0.001" inputmode="decimal"/></div>
          <div class="field"><label>Altura (cm)</label><input id="na" type="number" placeholder="0" inputmode="numeric"/></div>
          <div class="field"><label>Largura (cm)</label><input id="nl" type="number" placeholder="0" inputmode="numeric"/></div>
          <div class="field"><label>Comprimento (cm)</label><input id="nc" type="number" placeholder="0" inputmode="numeric"/></div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-ghost" id="btn-cancel-dim" onclick="cancelarEditDim()" style="display:none;flex-shrink:0">Cancelar</button>
          <button class="btn btn-primary" id="btn-salvar-dim" onclick="salvarDim()" style="flex:1">💾 Salvar Dimensão</button>
        </div>
      </div>

      <div class="card">
        <div class="flex jb ac mb-3" style="flex-wrap:wrap;gap:8px">
          <div class="card-title" style="margin:0">📦 Dimensões Cadastradas</div>
          <div class="filters" style="margin:0">
            <select class="fi" id="dfonte" onchange="filtDim()" style="flex:0 0 auto;min-width:140px">
              <option value="">Todas as fontes</option>
              <option value="catalogo">Portal Representantes</option>
              <option value="manual">Cadastro Manual</option>
            </select>
            <input class="fi" id="dq" placeholder="Buscar produto..." oninput="filtDim()"/>
          </div>
        </div>
        <div id="dims-list">${renderDims(dims,cat)}</div>
      </div>`;
  }catch(e){c.innerHTML=`<div class="empty"><div class="ei">❌</div><p>${e.message}</p></div>`}
}

function renderDims(dims,cat){
  const all=[
    ...cat.map(p=>({...p,_src:'catalogo',descricao:p.nome})),
    ...dims.map(p=>({...p,_src:'manual'}))
  ];
  if(!all.length)return`<div class="empty"><div class="ei">📭</div><p>Nenhum produto cadastrado</p></div>`;
  return`<div class="table-wrap">
    <table>
      <thead><tr><th>Fonte</th><th>Produto</th><th>Ref.</th><th>Peso</th><th>A×L×C (cm)</th><th>Vol. m³</th><th></th></tr></thead>
      <tbody>
        ${all.map(p=>{
          const vol=p.volume_m3||(p.altura_cm&&p.largura_cm&&p.comprimento_cm?(p.altura_cm/100*p.largura_cm/100*p.comprimento_cm/100).toFixed(6):null);
          const inc=!medidasCompletas(p);
          return`<tr${inc?' style="background:var(--warning-bg)"':''}>
            <td><span class="badge ${p._src==='catalogo'?'b-blue':'b-purple'}">${p._src==='catalogo'?'Portal':'Manual'}</span>${inc?'<div style="font-size:9.5px;color:var(--warn);font-weight:700;margin-top:3px">SEM MEDIDA</div>':''}</td>
            <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600">${p.descricao||p.nome||'—'}</td>
            <td class="text-muted">${p.referencia||'—'}</td>
            <td>${p.peso_kg?N(p.peso_kg)+' kg':'—'}</td>
            <td>${p.altura_cm&&p.largura_cm&&p.comprimento_cm?`${p.altura_cm}×${p.largura_cm}×${p.comprimento_cm}`:'—'}</td>
            <td>${vol?Number(vol).toFixed(4):'—'}</td>
            <td style="white-space:nowrap">${p._src==='manual'?`<button class="btn btn-ghost btn-sm" onclick="editDim(${p.id})" style="padding:5px 9px;margin-right:4px">✏️</button><button class="btn btn-danger btn-sm" onclick="delDim(${p.id})" style="padding:5px 9px">🗑️</button>`:'—'}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
}

function filtDim(){
  const c=document.getElementById('pg');
  const dims=c.__dims||[],cat=c.__cat||[];
  const fonte=document.getElementById('dfonte')?.value||'';
  const q=(document.getElementById('dq')?.value||'').toLowerCase();
  let fd=dims,fc=cat;
  if(fonte==='manual')fc=[];
  if(fonte==='catalogo')fd=[];
  if(q){fd=fd.filter(p=>(p.descricao||'').toLowerCase().includes(q)||(p.referencia||'').toLowerCase().includes(q));fc=fc.filter(p=>(p.nome||'').toLowerCase().includes(q)||(p.referencia||'').toLowerCase().includes(q));}
  document.getElementById('dims-list').innerHTML=renderDims(fd,fc);
}

async function salvarDim(){
  const desc=(document.getElementById('nd')?.value||'').trim();
  const ref=(document.getElementById('nr')?.value||'').trim();
  const peso=parseFloat(document.getElementById('np')?.value)||null;
  const alt=parseFloat(document.getElementById('na')?.value)||null;
  const lar=parseFloat(document.getElementById('nl')?.value)||null;
  const com=parseFloat(document.getElementById('nc')?.value)||null;
  if(!desc){toast('Informe a descrição do produto','error');return}
  if(!peso){toast('Informe o peso','error');return}
  const editando=_editDimId!=null;
  const corpo={descricao:desc,referencia:ref||null,peso_kg:peso,altura_cm:alt,largura_cm:lar,comprimento_cm:com,ativo:true,atualizado_em:new Date().toISOString()};
  try{
    const url=editando?`${SB}/rest/v1/frt_produtos_dimensoes?id=eq.${_editDimId}`:`${SB}/rest/v1/frt_produtos_dimensoes`;
    const r=await fetch(url,{
      method:editando?'PATCH':'POST',
      headers:{...hdrs(),'Prefer':'return=representation'},
      body:JSON.stringify(corpo)
    });
    if(!r.ok)throw new Error(`HTTP ${r.status}: ${(await r.text()).slice(0,200)}`);
    bononiLog('ACAO',editando?'EDITAR_DIMENSAO':'CRIAR_DIMENSAO',{modulo:'dimensoes',entidade:'dimensao',id_entidade:_editDimId||null,nome_entidade:desc});
    toast(editando?'Produto atualizado!':'Dimensão salva com sucesso!','success');
    _prodCache=null; // força recarregar o catálogo da cotação
    cancelarEditDim();
    pgDimensoes();
  }catch(e){
    bononiLog('ERRO',editando?'ERRO_EDITAR_DIMENSAO':'ERRO_CRIAR_DIMENSAO',{modulo:'dimensoes',entidade:'dimensao',nome_entidade:desc,erro:e});
    const em=msgErroFrete(e.message);
    toast(em.titulo+' — '+em.detalhe,'error');
  }
}

async function delDim(id){
  if(!await confirmar('Excluir esta dimensão?'))return;
  try{
    const rd=await fetch(`${SB}/rest/v1/frt_produtos_dimensoes?id=eq.${id}`,{
      method:'PATCH',headers:{...hdrs(),'Prefer':'return=minimal'},
      body:JSON.stringify({ativo:false})
    });
    if(!rd.ok)throw new Error(`HTTP ${rd.status}: ${(await rd.text()).slice(0,200)}`);
    bononiLog('ACAO','EXCLUIR_DIMENSAO',{modulo:'dimensoes',entidade:'dimensao',id_entidade:id});
    _prodCache=null;
    toast('Dimensão removida','success');pgDimensoes();
  }catch(e){
    bononiLog('ERRO','ERRO_EXCLUIR_DIMENSAO',{modulo:'dimensoes',entidade:'dimensao',id_entidade:id,erro:e});
    toast('Erro: '+e.message,'error');
  }
}

// ────────────────────────────────────────────
// PAGE: LOGS
// ────────────────────────────────────────────
async function pgLogs(){
  const c=document.getElementById('pg');
  c.innerHTML=`<div class="loading"><div class="spinner"></div>Carregando...</div>`;
  try{
    const logs=await db('frt_logs?select=*&order=criado_em.desc');
    const filtrados=filtrarPorMes(logs,'criado_em',mesGlobal);
    const er=filtrados.filter(l=>l.tipo==='ERRO').length,ac=filtrados.filter(l=>l.tipo==='ACAO').length,inf=filtrados.filter(l=>l.tipo==='INFO').length;
    c.__logs=filtrados;
    c.innerHTML=`
      <div class="stats-grid">
        <div class="stat c-blue"><div class="stat-lbl">Total</div><div class="stat-val">${filtrados.length}</div></div>
        <div class="stat c-red"><div class="stat-lbl">Erros</div><div class="stat-val">${er}</div></div>
        <div class="stat c-green"><div class="stat-lbl">Ações</div><div class="stat-val">${ac}</div></div>
        <div class="stat c-warn"><div class="stat-lbl">Info</div><div class="stat-val">${inf}</div></div>
      </div>
      <div class="card">
        <div class="flex jb ac mb-3" style="flex-wrap:wrap;gap:8px">
          <div class="card-title" style="margin:0">🔍 Logs</div>
          <div class="filters" style="margin:0">
            <select class="fi" id="lt" onchange="filtLog()" style="flex:0 0 auto"><option value="">Todos</option><option value="ERRO">Erros</option><option value="ACAO">Ações</option><option value="INFO">Info</option></select>
            <select class="fi" id="lc" onchange="filtLog()" style="flex:0 0 auto"><option value="">Todos módulos</option><option value="cotacao">Cotação</option><option value="auditoria">Auditoria</option><option value="dimensoes">Dimensões</option><option value="banco">Banco</option><option value="sistema">Sistema</option></select>
            <input class="fi" id="lq" placeholder="Buscar..." oninput="filtLog()"/>
          </div>
        </div>
        <div class="flex gap-2 mb-3" style="flex-wrap:wrap">
          <button class="btn btn-ghost btn-sm" onclick="pgLogs()">↺ Atualizar</button>
          <button class="btn btn-danger btn-sm" onclick="limparLogs()">🗑️ Limpar &gt;30 dias</button>
        </div>
        <div id="logs-list">${renderLogs(filtrados)}</div>
      </div>`;
  }catch(e){c.innerHTML=`<div class="empty"><div class="ei">✅</div><p>Nenhum log ou tabela não encontrada.<br><small>${e.message}</small></p></div>`}
}
function renderLogs(logs){
  if(!logs.length)return`<div class="empty"><div class="ei">✅</div><p>Sem eventos</p></div>`;
  const ic={ERRO:'❌',ACAO:'✅',INFO:'ℹ️'};
  const bc={ERRO:'b-red',ACAO:'b-ok',INFO:'b-warn'};
  return logs.map((l,i)=>{
    const det=l.erro_msg||l.erro_stack||l.contexto;
    const desc=l.acao||l.descricao||'—';
    return`<div class="log-item log-${l.tipo}" onclick="document.getElementById('ld-${i}')?.classList.toggle('open')">
    <div class="log-icon">${ic[l.tipo]||'ℹ️'}</div>
    <div class="log-body">
      <div class="log-desc">${desc}${l.nome_entidade?` — ${l.nome_entidade}`:l.id_entidade?` #${l.id_entidade}`:''}</div>
      <div class="log-meta">
        <span>⏰ ${DT(l.criado_em)}</span>
        ${l.modulo?`<span>📁 ${l.modulo}</span>`:''}
        ${l.usuario_nome?`<span>👤 ${l.usuario_nome}</span>`:''}
        <span class="badge ${bc[l.tipo]||'b-ok'}">${l.nivel||l.tipo}</span>
      </div>
      ${l.erro_msg?`<div style="color:var(--danger);font-size:12px;margin-top:4px">${l.erro_msg}</div>`:''}
      ${det?`<div class="log-detail" id="ld-${i}">${l.erro_stack?l.erro_stack+'\n':''}${l.contexto?JSON.stringify(l.contexto,null,2):''}</div>`:''}
    </div>
  </div>`}).join('');
}
function filtLog(){
  const c=document.getElementById('pg'),logs=c.__logs||[];
  const t=document.getElementById('lt')?.value||'',mod=document.getElementById('lc')?.value||'',q=(document.getElementById('lq')?.value||'').toLowerCase();
  const f=logs.filter(l=>(!t||l.tipo===t)&&(!mod||l.modulo===mod)&&(!q||JSON.stringify(l).toLowerCase().includes(q)));
  document.getElementById('logs-list').innerHTML=renderLogs(f);
}
async function limparLogs(){
  if(!await confirmar('Excluir logs com mais de 30 dias?'))return;
  try{
    const cut=new Date(Date.now()-30*86400000).toISOString();
    const r=await fetch(`${SB}/rest/v1/frt_logs?criado_em=lt.${cut}`,{method:'DELETE',headers:hdrs()});
    if(!r.ok)throw new Error(`HTTP ${r.status}: ${(await r.text()).slice(0,200)}`);
    bononiLog('ACAO','LIMPAR_LOGS',{modulo:'sistema'});
    toast('Logs antigos removidos','success');pgLogs();
  }catch(e){
    bononiLog('ERRO','ERRO_LIMPAR_LOGS',{modulo:'sistema',erro:e});
    toast('Erro: '+e.message,'error');
  }
}
</script>
