<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Frete — Bononi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400..800;1,400..800&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="ds/bononi-ds.css?v=20260915a">
<style>
/* ── PONTE DE VARIÁVEIS ───────────────────────────────────────────────────────
   Cada nome antigo aponta para o token semântico do Design System Bononi. É o que
   faz os 157 `style=` inline herdarem a paleta sem reescrever um por um.
   CÓDIGO NOVO usa o token do DS direto, não a ponte. */
:root{
  --bg:var(--surface-page);          /* #f6f8fa */
  --surface:var(--surface-card);     /* #ffffff */
  --surface2:var(--surface-sunken);  /* #eef1f5 */
  --border:var(--border-subtle);     /* #e0e4ea */
  --text:var(--text-strong);         /* tinta #14161a */
  --muted:var(--text-muted);         /* #6b7382 */

  /* A virada que importa: ação primária é TINTA, não o azul-marinho de antes.
     O vermelho #c11f25 passa a ser acento — no máximo um por tela. */
  --accent:var(--action-primary);
  --sidebar-bg:var(--surface-nav);   /* tinta #14161a */

  --green:var(--status-ok-text);     --success-bg:var(--status-ok-bg);
  --warn:var(--status-warn-text);    --warning-bg:var(--status-warn-bg);
  --danger:var(--status-crit-text);  --destructive-bg:var(--status-crit-bg);
  --blue:var(--status-info-text);    --blue-pale:var(--status-info-bg);

  /* --blue-light era o azul-claro do realce. Sobre superfície clara vira o acento
     vermelho do DS; o realce da sidebar escura está em .nav-item.active. */
  --blue-light:var(--border-accent);
  /* --purple não existe no DS. Carregava informação em dois pares (PF×PJ,
     Manual×Portal), então foi para a rampa base como neutro forte — distinguível
     de --blue (categoria) e de --muted (ausência), sem inventar uma segunda cor. */
  --purple:var(--bnn-ink-900);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font-ui);background:var(--bg);color:var(--text)}
#app{display:flex;height:100vh;overflow:hidden}

/* ÍCONES — Lucide (set substituto do DS) como CSS mask, pra herdar currentColor.
   Uso: <i class="ic" data-ic="truck"></i> — hidratado pelo MutationObserver. */
.ic{display:inline-block;width:16px;height:16px;flex:0 0 auto;background-color:currentColor;
  -webkit-mask:var(--ic) no-repeat center / contain;mask:var(--ic) no-repeat center / contain;vertical-align:-3px}
.ic-sm{width:14px;height:14px;vertical-align:-2px}
.ic-lg{width:20px;height:20px;vertical-align:-4px}
.ic-xl{width:24px;height:24px;vertical-align:-5px}

/* SIDEBAR */
#sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--sidebar-bg);border-right:none;display:flex;flex-direction:column;transition:transform var(--dur-slow) var(--ease-standard);z-index:50}
.sb-logo{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-logo img{display:block;height:22px;width:auto;margin-bottom:8px}
.sb-brand{font:var(--type-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:rgba(255,255,255,.45);display:block;margin-bottom:2px}
.sb-title{font:var(--type-h3);color:var(--text-inverse)}
nav{flex:1;padding:10px 8px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:var(--radius-md);cursor:pointer;font:var(--type-small);color:rgba(255,255,255,.65);margin-bottom:2px;transition:var(--transition-control);border:1px solid transparent;border-left:3px solid transparent;user-select:none;width:100%;min-height:var(--control-h-lg);text-align:left;background:transparent}
/* press = deslocamento de 1px (DS). Nunca opacidade, nunca escala. */
.nav-item:active{transform:translateY(1px)}
.nav-item:hover{background:rgba(255,255,255,.04);color:var(--text-inverse)}
/* realce da sidebar escura: texto em branco cheio e o rule vermelho do acento.
   O azul-claro de antes dava 3,04:1 — menos legível que os itens inativos. */
.nav-item.active{background:rgba(255,255,255,.08);color:var(--text-inverse);border-left-color:var(--bnn-red-400)}
.nav-icon{width:20px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08)}
#sb-user{font:var(--type-body-strong);color:var(--text-inverse);margin-bottom:4px}
.btn-sair{color:rgba(255,255,255,.55);cursor:pointer;font:var(--type-label)}

/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;min-height:var(--topbar-h);flex-shrink:0;gap:10px;box-shadow:var(--shadow-sticky)}
#menu-btn{display:none;background:none;border:none;color:var(--text);cursor:pointer;padding:6px;border-radius:var(--radius-md);flex-shrink:0;min-width:var(--control-h-lg);min-height:var(--control-h-lg);align-items:center;justify-content:center}
.topbar h1{font:var(--type-h3);color:var(--text-strong)}
.topbar-sub{font:var(--type-overline);text-transform:none;letter-spacing:var(--ls-normal);color:var(--muted);margin-top:1px}
/* título trunca em vez de quebrar em 5 linhas quando o filtro de mês disputa a largura */
.topbar h1,.topbar-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mes-filtro-wrap{min-width:0}
#mes-filtro-wrap #mes-global{min-width:0;max-width:180px}
.page{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
/* o DS limita o conteúdo a 1440px; sem isso o campo de CPF/CNPJ esticava
   para ~1000px em monitor largo, para caber 18 caracteres */
.page>*{max-width:var(--page-max);margin-inline:auto}
/* folga para a barra fixa, só na tela que realmente a tem */
body:has(#sticky-cotar) .page{padding-bottom:96px}

/* OVERLAY */
#overlay{display:none;position:fixed;inset:0;background:var(--scrim);z-index:49}
#overlay.open{display:block}

/* CONFIRM MODAL */
.confirm-overlay{position:fixed;inset:0;background:var(--scrim);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.confirm-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;width:100%;max-width:360px;text-align:center;box-shadow:var(--shadow-overlay)}

/* BOTÃO COTAR FIXO — fundo sólido + hairline no topo. O DS proíbe gradiente
   nos sistemas internos, e o gradiente antigo esmaecia para a cor da página
   enquanto passava por cima de cartões brancos, deixando uma emenda visível. */
#sticky-cotar{position:fixed;bottom:0;left:0;right:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--surface-page);border-top:1px solid var(--border);z-index:40;display:flex;gap:8px}
#sticky-cotar .btn:focus-visible{box-shadow:var(--focus-ring)}
@media(min-width:769px){#sticky-cotar{left:var(--sidebar-w)}}
.confirm-box p{font:var(--type-body);margin-bottom:20px}
.confirm-btns{display:flex;gap:10px;justify-content:center}

/* INPUTS */
input,select,textarea{font-family:var(--font-ui);font-size:var(--fs-16);color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-md);padding:11px 12px;outline:none;-webkit-appearance:none;width:100%;min-height:var(--control-h-lg);transition:var(--transition-control)}
/* campo em foco: borda tinta + halo, como manda o DS (nunca azul) */
input:focus,select:focus,textarea:focus{border-color:var(--border-focus);box-shadow:0 0 0 3px rgba(20,22,26,.08)}

/* FOCO DE TECLADO — anel em tinta. Duplo (outline + box-shadow) porque webview
   de preview sobrescreve outline; em navegador normal os dois coincidem. */
:focus-visible{outline:2px solid var(--border-focus);outline-offset:2px;box-shadow:var(--focus-ring)}
.nav-item:focus-visible{outline-color:var(--bnn-white);box-shadow:0 0 0 2px var(--surface-nav),0 0 0 4px var(--bnn-white)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
input::placeholder{color:var(--muted)}
select option{background:var(--surface2)}
textarea{resize:vertical;min-height:72px}

/* BTNS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px var(--control-pad-x-lg);border-radius:var(--radius-md);font:var(--type-body-strong);cursor:pointer;border:none;transition:var(--transition-control);user-select:none;min-height:var(--control-h-lg)}
/* press = 1px para baixo + o degrau "active" da própria cor. Sem escala, sem opacidade. */
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--action-primary);color:var(--text-inverse)}
.btn-primary:hover{background:var(--action-primary-hover)}
.btn-primary:active{background:var(--action-primary-active)}
/* o único vermelho da tela, quando houver: acento */
.btn-accent{background:var(--action-accent);color:var(--text-inverse)}
.btn-accent:hover{background:var(--action-accent-hover)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--surface-hover);color:var(--text)}
.btn-danger{background:transparent;color:var(--action-danger);border:1px solid var(--action-danger)}
.btn-danger:hover{background:var(--status-crit-bg)}
.btn-success{background:var(--success-bg);color:var(--green);border:1px solid var(--green)}
.btn-full{width:100%}
.btn-sm{padding:7px var(--control-pad-x-sm);font:var(--type-label);min-height:var(--control-h-md)}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:14px;box-shadow:var(--shadow-card)}
.card-title{font:var(--type-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:7px}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;box-shadow:var(--shadow-card)}
.stat-lbl{font:var(--type-overline);letter-spacing:var(--ls-caps);color:var(--muted);text-transform:uppercase;margin-bottom:5px}
.stat-val{font:var(--fw-bold) var(--fs-24)/var(--lh-tight) var(--font-mono);font-variant-numeric:tabular-nums}
.c-green .stat-val{color:var(--green)}.c-warn .stat-val{color:var(--warn)}.c-red .stat-val{color:var(--danger)}.c-blue .stat-val{color:var(--blue)}

/* FORM */
.grid{display:grid;gap:12px;margin-bottom:14px}
.g2{grid-template-columns:1fr 1fr}
.g1{grid-template-columns:1fr}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font:var(--type-label);color:var(--muted)}
.field.full{grid-column:1/-1}

/* VOLUME BOX */
.vol-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;margin-bottom:10px}
.vol-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.vol-lbl{font:var(--type-overline);letter-spacing:var(--ls-caps);color:var(--muted);text-transform:uppercase}

/* PRODUTOS */
.prod-search-wrap{margin-bottom:10px}
.prod-search-wrap input{width:100%}
.prod-table-wrap{max-height:220px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-lg);margin-top:6px;background:var(--surface)}
.prod-table{width:100%;border-collapse:collapse;font-size:var(--fs-12)}
.prod-table th{position:sticky;top:0;background:var(--surface2);padding:6px 8px;text-align:left;font:var(--type-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}
.prod-table td{padding:8px;border-bottom:1px solid var(--border);vertical-align:middle}
.prod-table tbody tr:hover td,.prod-table tbody tr:active td{background:var(--surface-hover)}

/* TABS */
.tabs{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-md);padding:3px;gap:2px}
.tab{border:none;background:transparent;padding:8px 16px;border-radius:var(--radius-sm);font:var(--type-body-strong);color:var(--muted);cursor:pointer;min-height:var(--control-h-md)}
.tab.active{background:var(--surface);color:var(--text-strong);box-shadow:var(--shadow-card)}

/* VOL TABLE (resumo) */
.vol-table{width:100%;border-collapse:collapse;font-size:var(--fs-13)}
.vol-table th{padding:8px;text-align:left;font:var(--type-overline);letter-spacing:var(--ls-caps);color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap}
.vol-table td{padding:8px;border-bottom:1px solid var(--border);vertical-align:middle}
.vol-table tfoot td{border-bottom:none;padding-top:10px}
.prod-table tr:last-child td{border-bottom:none}
.prod-table .btn-sel{padding:4px 10px;font:var(--type-overline);white-space:nowrap;min-height:var(--control-h-sm)}
.prod-list{margin-top:8px}
.prod-item{
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:10px 12px;margin-bottom:8px;
}
.prod-item-hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.prod-item-nome{font:var(--type-body-strong);line-height:var(--lh-snug)}
.prod-item-dims{font:var(--type-label);font-weight:var(--fw-regular);color:var(--muted);margin-top:2px}
.prod-item-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.prod-item-row label{font:var(--type-label);color:var(--muted);flex-shrink:0}
.prod-item-row input{max-width:92px;padding:6px 8px;font-size:var(--fs-16);text-align:center}
/* Três etiquetas que carregam informação distinta — puxadas da rampa base do DS
   para continuarem distinguíveis sem inventar matiz fora da paleta. */
.badge-novo{background:var(--bnn-gray-200);--badge-dot:var(--bnn-ink-900);flex-shrink:0}
.badge-catalogo{background:var(--status-info-bg);--badge-dot:var(--status-info-text);flex-shrink:0}
.badge-dim{background:var(--status-ok-bg);--badge-dot:var(--status-ok-text);flex-shrink:0}

/* RESULTADO COTAÇÃO */
.result-grid{display:grid;gap:12px}
.r-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;position:relative}
.r-card.winner{border-color:var(--green);background:var(--success-bg)}
.r-winner-badge{position:absolute;top:-9px;right:12px;background:var(--green);color:var(--text-inverse);font:var(--type-overline);padding:2px 9px;border-radius:var(--radius-pill)}
.r-transp{font:var(--type-h3);margin-bottom:3px}
.r-prazo{font:var(--type-label);font-weight:var(--fw-regular);color:var(--muted);margin-bottom:10px}
.r-preco{font:var(--fw-black) var(--fs-24)/var(--lh-tight) var(--font-mono);font-variant-numeric:tabular-nums}
.r-card.winner .r-preco{color:var(--green)}
.r-detail{font:var(--type-label);font-weight:var(--fw-regular);color:var(--muted);margin-top:4px}
.r-error .r-preco{color:var(--danger);font:var(--type-body-strong);line-height:var(--lh-snug)}
.err-box{display:flex;gap:12px;align-items:flex-start;border-left:3px solid var(--danger);background:var(--surface)}
.err-ic{color:var(--danger);flex-shrink:0}
.err-tit{font:var(--type-body-strong);color:var(--danger);margin-bottom:3px}
.err-det{font:var(--type-small);color:var(--muted)}
.err-tec{margin-top:8px}
.err-tec summary{font:var(--type-overline);letter-spacing:var(--ls-caps);color:var(--muted);cursor:pointer;text-transform:uppercase}
.err-tec code{display:block;margin-top:5px;font-family:var(--font-mono);font-size:var(--fs-11);color:var(--muted);background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-md);padding:6px 8px;word-break:break-all;white-space:pre-wrap}
.r-error{border-color:var(--status-crit-text)}

/* AUDITORIA */
/* CARTÃO DE LINHA (mobile) — mesma casca para Auditoria, Conferência, Dimensões
   e Histórico. O vocabulário .cte-* já existia no CSS sem nenhum uso no JS;
   virou a base das quatro telas em vez de inventar um quinto. */
.cte-card,.hist-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;margin-bottom:10px}
.cte-hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.cte-num{font:var(--fw-bold) var(--fs-14)/var(--lh-snug) var(--font-mono);font-variant-numeric:tabular-nums}
.cte-sub{font:var(--type-label);font-weight:var(--fw-regular);color:var(--muted);margin-top:2px}
.cte-row,.hist-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 0;font-size:var(--fs-13)}
.cte-row{border-bottom:1px solid var(--border)}
.cte-row:last-of-type{border-bottom:none}
.cte-lbl,.hist-lbl{color:var(--muted);font:var(--type-label);flex-shrink:0}
/* o lado direito quebra em vez de estourar o cartão */
.cte-val{text-align:right;min-width:0;overflow-wrap:anywhere}
.cte-campo{display:block;margin-top:10px;margin-bottom:4px}
.div-pos{color:var(--danger);font-weight:var(--fw-bold)}
.div-neg{color:var(--green);font-weight:var(--fw-bold)}
.cte-obs{margin-top:10px}
.cte-obs textarea{font-size:var(--fs-16);padding:8px 10px;min-height:56px}
.cte-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.audit-select{width:100%;margin-top:8px;padding:9px 12px;font-size:var(--fs-16)}

/* DESKTOP TABLE */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:var(--fs-13)}
thead th{text-align:left;padding:9px 12px;background:var(--surface2);color:var(--muted);font:var(--type-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr{border-bottom:1px solid var(--border);transition:background-color var(--dur-instant) var(--ease-standard)}
tbody tr:hover{background:var(--surface-hover)}
tbody td{padding:9px 12px;vertical-align:middle}
td select{padding:5px 8px;font-size:var(--fs-16);border-radius:var(--radius-md)}
/* no desktop a densidade da tabela manda; no toque, os 44px mandam */
@media(min-width:769px){td select{min-height:var(--row-h-compact)}}

/* (.hist-card / .hist-row / .hist-lbl estão definidos junto com .cte-* acima) */

/* LOGS */
.log-item{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px;cursor:pointer}
.log-item.log-ERRO{border-left:3px solid var(--danger)}
.log-item.log-ACAO{border-left:3px solid var(--green)}
/* INFO era âmbar — cor de aviso em evento rotineiro treina o operador a ignorar
   âmbar justamente quando ele importa. Passou para o azul de informação. */
.log-item.log-INFO{border-left:3px solid var(--blue)}
.log-icon{flex-shrink:0;margin-top:1px}
.log-item.log-ERRO .log-icon{color:var(--danger)}
.log-item.log-ACAO .log-icon{color:var(--green)}
.log-item.log-INFO .log-icon{color:var(--blue)}
.log-body{flex:1;min-width:0}
.log-desc{font:var(--type-small);margin-bottom:4px;word-break:break-word}
.log-meta{font:var(--type-label);font-weight:var(--fw-regular);color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.log-detail{margin-top:8px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px;font-family:var(--font-mono);font-size:var(--fs-12);color:var(--text);white-space:pre-wrap;display:none;max-height:180px;overflow-y:auto}
.log-detail.open{display:block}

/* BADGES */
/* Texto de estado em TINTA + ponto colorido, como manda 05-acessibilidade:
   "Badge sempre traz o texto do estado, e o dot é reforço, não a informação."
   Texto colorido sobre o tint não fecha 4,5:1 em 4 dos 6 variantes — o âmbar dá
   3,3:1 (o 03-visual.md do pacote afirma ~4,6:1; a conta não bate). Em tinta,
   todos passam de 12:1 e a cor continua distinguindo, pelo ponto. */
.badge,.badge-novo,.badge-catalogo,.badge-dim{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:var(--radius-sm);font:var(--type-overline);letter-spacing:var(--ls-caps);white-space:nowrap;text-transform:uppercase;color:var(--text-body);background:var(--surface2)}
.badge::before,.badge-novo::before,.badge-catalogo::before,.badge-dim::before{content:'';width:6px;height:6px;border-radius:var(--radius-pill);background:var(--badge-dot,var(--text-faint));flex:0 0 auto}
/* etiqueta que já traz ícone não leva ponto também */
.badge:has(.ic)::before{display:none}

const LUCIDE = 'https://unpkg.com/lucide-static@0.544.0/icons/';
function ic(nome, cls) { return `<i class="ic${cls ? ' ' + cls : ''}" data-ic="${nome}"></i>`; }
function _pintaIcone(el) {
  if (el.dataset.icOn) return;
  el.style.setProperty('--ic', `url(${LUCIDE}${el.dataset.ic}.svg)`);
  el.dataset.icOn = '1';

// As telas são montadas com innerHTML em dezenas de pontos; o observer evita ter

new MutationObserver(muts => {
  for (const m of muts) for (const nd of m.addedNodes) {
    if (nd.nodeType !== 1) continue;
    if (nd.matches('i.ic[data-ic]')) _pintaIcone(nd);
    else if (nd.firstElementChild) hydrateIcons(nd);

}).observe(document.documentElement, { childList: true, subtree: true });

function hdrs(){return{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'}}
// Linhas por requisição. Medido em 16/09/2026 contra os 21.727 leads de 6 meses do
// e-commerce: 1.000 → 22 req / 14.450 ms · 2.000 → 11 req / 8.966 ms · 5.000 → 5 req /
// 5.462 ms. Paginar re-executa a consulta inteira a cada página (o PostgREST vira
// LIMIT/OFFSET), então página pequena é cara. 5.000 tem folga de 2x sobre o teto de
// 10.000 do servidor — e a paginação continua correta se esse teto mudar.
const PAGINA_BUSCA=5000;
// Teto de sanidade: 50 requisições (250 mil linhas). Se bater aqui, o filtro está errado —
// melhor estourar alto e visível do que devolver meio resultado calado.
const MAX_REQUISICOES_BUSCA=50;

// uma requisição só — é aqui que mora o tratamento de erro/log
async function _dbReq(path,opts,de,ate){
  const cab=hdrs();
  if(de!=null)Object.assign(cab,{'Range-Unit':'items','Range':`${de}-${ate}`});
  let r;
  try{
    r=await fetch(`${SB}/rest/v1/${path}`,{headers:cab,...opts});
  }catch(netErr){
    // erro de rede — sem resposta do servidor
    const msg=`Erro de rede: ${netErr.message}`;
    bononiLog('ERRO','ERRO_QUERY',{modulo:'banco',erro:netErr,contexto:{query:path.split('?')[0]}});
    throw new Error(msg);
  }
  if(!r.ok){
    const body=await r.text();
    const msg=`[${r.status}] ${body.slice(0,300)}`;
    // loga automaticamente todo erro de banco com query e status
    bononiLog('ERRO','ERRO_QUERY',{modulo:'banco',

      contexto:{
        tabela: path.split('?')[0],
        status: r.status,
        erro:   body.slice(0,500),
        metodo: opts.method||'GET',
      }
    });
    throw new Error(msg);
  }
  return r.json();
}

/**
 * Lê do PostgREST trazendo TODAS as linhas, em páginas.
 *
 * Até 16/09/2026 esta função grudava `limit=9999` em toda consulta. Aquilo **não era
 * paginação, era um teto**: passando de 10.000 linhas o PostgREST corta e responde 200,
 * sem erro e sem aviso. E já cortava: `frt_cotacoes_respostas` tem 12.928 linhas e a tela
 * de cotações recebia 9.999 — faltava resposta de transportadora no comparativo, sempre
 * para menos e sem nada na tela dizendo isso.
 *
 * Duas propriedades que fazem isto funcionar:
 *
 * 1. **Ordem estável.** Sem ordenação garantida o Postgres pode repetir uma linha numa
 *    página e pular outra na seguinte — erro pior que o truncamento, porque não aparece na
 *    contagem. Vários chamadores daqui ordenam por campo que repete (`order=nome`), então
 *    a função acrescenta `id` como critério de desempate. Para view sem `id` (há 7 em
 *    `frt_*`, como `frt_nf_sem_cte`), passe a chave em `opts.chave`; `opts.chave=null`
 *    desliga a paginação e faz uma requisição só.
 * 2. **Avança pelo que a resposta trouxe**, não por `página × tamanho` — então continua
 *    correta se o servidor tiver teto por requisição menor que PAGINA_BUSCA.
 *
 * Escrita (POST/PATCH/DELETE) e consulta com `limit=` explícito passam direto, sem paginar.
 */
async function db(path,opts={}){
  const {chave,...req}=opts;
  const metodo=(req.method||'GET').toUpperCase();
  // escrita, ou o chamador já limitou de propósito, ou pediu para não paginar
  if(metodo!=='GET'||/[?&]limit=/.test(path)||chave===null)return _dbReq(path,req,null,null);

  // ordem estável: acrescenta a chave como último critério de desempate
  const k=chave||'id';
  let alvo;
  if(/[?&]order=/.test(path)) alvo=path.replace(/([?&]order=)([^&]*)/,(m,p,v)=>`${p}${v},${k}`);
  else                        alvo=`${path}${path.includes('?')?'&':'?'}order=${k}`;

  const tudo=[];let de=0,maiorLote=0;
  for(let i=0;i<MAX_REQUISICOES_BUSCA;i++){
    const lote=await _dbReq(alvo,req,de,de+PAGINA_BUSCA-1);
    if(!Array.isArray(lote))return lote;   // resposta que não é lista: devolve como veio
    tudo.push(...lote);
    if(!lote.length)return tudo;
    // veio menos do que o servidor já provou que entrega → acabaram os dados
    // (na primeira volta maiorLote ainda é 0, então não corta cedo por engano)
    if(lote.length<maiorLote)return tudo;
    maiorLote=Math.max(maiorLote,lote.length);
    de+=lote.length;
  }
  throw new Error(`db: passou de ${MAX_REQUISICOES_BUSCA} requisições (${tudo.length} linhas) em ${path.split('?')[0]}. O filtro provavelmente está amplo demais.`);
}

async function bononiLog(tipo, acao, dados = {}) {
  try {
    await fetch(`${SB}/rest/v1/${_LOG_TABLE}`, {
      method: 'POST',
      headers: {...hdrs(), 'Prefer': 'return=minimal'},

        contexto:       dados.contexto       || null,
        url:            window.location.href,
        user_agent:     navigator.userAgent
      })
    });
  } catch (_) { /* nunca quebra o fluxo */ }
}

function confirmar(msg){
  return new Promise(resolve=>{
    const ov=document.createElement('div');ov.className='confirm-overlay';
    ov.innerHTML=`<div class="confirm-box"><p>${msg}</p><div class="confirm-btns">
      <button class="btn btn-ghost" id="_cn">Cancelar</button>

    document.body.appendChild(ov);
    ov.querySelector('#_cy').onclick=()=>{ov.remove();resolve(true)};
    ov.querySelector('#_cn').onclick=()=>{ov.remove();resolve(false)};
  });
}

// Produto só pode ser cotado se tiver peso + as 3 medidas
function medidasCompletas(p){
  return Number(p?.peso_kg)>0 && Number(p?.altura_cm)>0 && Number(p?.largura_cm)>0 && Number(p?.comprimento_cm)>0;
}

// Cache de produtos — carrega 1x e filtra local
let _prodCache=null;
let _prodOcultos=0;
async function carregarProdutos(){
  if(_prodCache) return _prodCache;
  const [cat,dim]=await Promise.all([
    db('frt_catalogo_produtos?select=id,nome,referencia,peso_kg,altura_cm,largura_cm,comprimento_cm&ativo=eq.true&order=nome').catch(()=>[]),
    db('frt_produtos_dimensoes?select=id,id_produto,descricao,referencia,peso_kg,altura_cm,largura_cm,comprimento_cm&ativo=eq.true&order=descricao').catch(()=>[])
  ]);
  const todos=[
    ...cat.map(p=>({...p,_src:'catalogo'})),
    ...dim.filter(d=>!cat.find(c=>c.referencia===d.referencia)).map(p=>({...p,nome:p.descricao,_src:'dim'}))
  ];
  // esconde quem não tem medidas completas — não dá pra cotar
  _prodCache=todos.filter(medidasCompletas);
  _prodOcultos=todos.length-_prodCache.length;
  return _prodCache;
}

// ── VOLUMES: estado central ──
let volumes=[];
let _prodLista=[];

function filtrarProdutos(q){
  if(!_prodCache)return;
  const termo=(q||'').toLowerCase();
  const lista=termo
    ? _prodCache.filter(p=>(p.nome||'').toLowerCase().includes(termo)||(p.referencia||'').toLowerCase().includes(termo))
    : _prodCache;
  renderProdTable(lista);
}

function renderProdTable(lista){
  const wrap=document.getElementById('prod-tabela');
  if(!wrap)return;
  if(!lista.length){wrap.innerHTML=`<div style="padding:16px;text-align:center;color:var(--muted);font-size:var(--fs-13)">Nenhum produto encontrado</div>`;return}
  _prodLista=lista;
  wrap.innerHTML=`<table class="prod-table">
    <thead><tr><th>Produto</th><th>Peso</th><th>A×L×C</th></tr></thead>
    <tbody>${lista.map((p,idx)=>{
      const dims=p.altura_cm&&p.largura_cm&&p.comprimento_cm?`${p.altura_cm}×${p.largura_cm}×${p.comprimento_cm}`:'—';
      return`<tr onclick="addVolCatalogo(${idx})" style="cursor:pointer">
        <td><div style="font-weight:600;font-size:var(--fs-12);line-height:1.3">${p.nome||'—'}</div>${p.referencia?`<div style="font-size:var(--fs-11);color:var(--muted)">Ref: ${p.referencia}</div>`:''}</td>
        <td style="white-space:nowrap;font-size:var(--fs-12)">${p.peso_kg?Number(p.peso_kg)+'kg':'—'}</td>
        <td style="white-space:nowrap;color:var(--blue);font-size:var(--fs-11)">${dims}</td>
      </tr>`}).join('')}

}

function addVolCatalogo(idx){
  const p=_prodLista[idx];
  if(!p){toast('Erro ao adicionar produto','error');return}
  volumes.push({
    nome:p.nome||p.descricao||p.referencia||'Produto',
    quantidade:1,
    peso_kg:Number(p.peso_kg)||0,
    altura_cm:Number(p.altura_cm)||0,
    largura_cm:Number(p.largura_cm)||0,
    comprimento_cm:Number(p.comprimento_cm)||0
  });
  renderVolumes();
  toast(`${p.nome||p.referencia} adicionado`,'success');
}

function addVolManual(){
  const q=parseInt(document.getElementById('m-q')?.value)||1;
  const peso=parseFloat(document.getElementById('m-p')?.value)||0;
  const a=parseFloat(document.getElementById('m-a')?.value)||0;
  const l=parseFloat(document.getElementById('m-l')?.value)||0;
  const c=parseFloat(document.getElementById('m-c')?.value)||0;
  if(peso<=0){toast('Informe o peso','error');return}
  volumes.push({nome:'Volume manual',quantidade:q,peso_kg:peso,altura_cm:a,largura_cm:l,comprimento_cm:c});
  ['m-p','m-a','m-l','m-c'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=''});

function setQtdVol(i,v){
  const q=Math.max(1,parseInt(v)||1);
  if(volumes[i]){volumes[i].quantidade=q;renderVolumes()}
}

function removerVolume(i){
  volumes.splice(i,1);
  renderVolumes();
}

function limparVolumes(){
  volumes=[];
  renderVolumes();
  const r=document.getElementById('result');if(r)r.innerHTML='';

  const rows=volumes.map((v,i)=>{
    const pt=v.quantidade*v.peso_kg;
    const m3=(v.altura_cm*v.largura_cm*v.comprimento_cm/1e6)*v.quantidade;
    pesoTotal+=pt;volTotal+=m3;

      <td style="font-weight:600;font-size:var(--fs-12)">${v.nome}</td>
      <td><input type="number" value="${v.quantidade}" min="1" onchange="setQtdVol(${i},this.value)" style="width:68px;padding:6px;text-align:center;font-size:var(--fs-16)" inputmode="numeric"/></td>

      <td style="white-space:nowrap;font-weight:600">${N(pt)}</td>
      <td style="white-space:nowrap;color:var(--blue);font-size:var(--fs-11)">${v.altura_cm}×${v.largura_cm}×${v.comprimento_cm}</td>

    </tr>`;

  const cubado=volTotal*300; // fator rodoviário 300kg/m³
  tb.innerHTML=`
    <thead><tr><th>Descrição</th><th>Qtd</th><th>Peso un.</th><th>Peso total</th><th>A×L×C (cm)</th><th>Vol. m³</th><th></th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr style="border-top:2px solid var(--border)">
      <td colspan="3" style="font-weight:700">Totais</td>

      <td style="color:var(--muted);font-size:var(--fs-11);white-space:nowrap">Cubado: ${N(cubado)} kg</td>

function mCEP(el){
  let v=el.value.replace(/\D/g,'');
  if(v.length>5)v=v.slice(0,5)+'-'+v.slice(5,8);
  el.value=v;
  const d=v.replace(/\D/g,'');
  const lbl=document.getElementById('cep-cidade');
  if(!lbl)return;
  if(d.length===8){lbl.style.color='var(--muted)';lbl.textContent='Buscando cidade...';buscarCidadeCep(d,lbl)}
  else{lbl.textContent=''}
}
let _cepCidadeCache={};
async function buscarCidadeCep(cep,lbl){
  if(_cepCidadeCache[cep]){lbl.style.color='var(--muted)';lbl.textContent=_cepCidadeCache[cep];return}
  try{
    const r=await fetch(`https://viacep.com.br/ws/${cep}/json/`);
    const d=await r.json();
    if(d.erro){lbl.style.color='var(--danger)';lbl.textContent='CEP não encontrado';return}
    const txt=`${d.localidade} / ${d.uf}`;
    _cepCidadeCache[cep]=txt;
    lbl.style.color='var(--muted)';lbl.textContent=txt;
  }catch{lbl.textContent=''}
}
// Máscara unificada CPF (PF) ou CNPJ (PJ) — detecta pelo tamanho
function mDocDest(el){
  let v=el.value.replace(/\D/g,'').slice(0,14);
  const badge=document.getElementById('badge-pf-pj');
  const digits=v.length;
  // decide se é CPF ou CNPJ pelo que já foi digitado
  // Se ≤11 dígitos mantém como CPF; se >11 trata como CNPJ
  const isPF=digits<=11&&(digits<12);
  if(isPF){
    // máscara CPF: 000.000.000-00
    if(v.length>9)       v=v.slice(0,3)+'.'+v.slice(3,6)+'.'+v.slice(6,9)+'-'+v.slice(9,11);
    else if(v.length>6)  v=v.slice(0,3)+'.'+v.slice(3,6)+'.'+v.slice(6);
    else if(v.length>3)  v=v.slice(0,3)+'.'+v.slice(3);
    el.maxLength=14; // 000.000.000-00
    if(badge){
      if(digits===11) badge.innerHTML='<span class="badge b-purple"><i class="ic ic-sm" data-ic="user"></i> Pessoa Física</span>';
      else badge.innerHTML='';
    }
  }else{
    // máscara CNPJ: 00.000.000/0000-00
    if(v.length>12)      v=v.slice(0,2)+'.'+v.slice(2,5)+'.'+v.slice(5,8)+'/'+v.slice(8,12)+'-'+v.slice(12);
    else if(v.length>8)  v=v.slice(0,2)+'.'+v.slice(2,5)+'.'+v.slice(5,8)+'/'+v.slice(8);
    else if(v.length>5)  v=v.slice(0,2)+'.'+v.slice(2,5)+'.'+v.slice(5);
    else if(v.length>2)  v=v.slice(0,2)+'.'+v.slice(2);
    el.maxLength=18; // 00.000.000/0000-00
    if(badge){
      if(digits===14) badge.innerHTML='<span class="badge b-blue"><i class="ic ic-sm" data-ic="building-2"></i> Pessoa Jurídica</span>';
      else badge.innerHTML='';
    }
  }
  el.value=v;
}

// ── Tradução de erros técnicos para linguagem clara ──
function msgErroFrete(raw){
  let txt=String(raw||'').trim();
  // extrai a mensagem de dentro de um JSON, se vier assim
  const m=txt.match(/\{[\s\S]*\}/);
  if(m){
    try{
      const j=JSON.parse(m[0]);
      txt=j.erro||j.error||j.message||j.mensagem||j.msg||txt;
      if(typeof txt==='object')txt=JSON.stringify(txt);
    }catch(_){}
  }
  const t=txt.toLowerCase();
  const R=(titulo,detalhe)=>({titulo,detalhe,tecnico:String(raw||'').slice(0,300)});
  if(/cep.*(nao|não).*(encontrad|localizad)|(nao|não).*(encontrad).*cep|cep inv[aá]lid/.test(t))
    return R('CEP não encontrado','Confira o CEP digitado — ele não existe na base dos Correios.');
  if(/fora da malha|sem cobertura|(nao|não) atend|sem atendimento|localidade (nao|não)|praça (nao|não)|rota (nao|não)/.test(t))
    return R('CEP fora da malha','A transportadora não atende esta região.');
  if(/timeout|timed out|aborted|etimedout|demorou/.test(t))
    return R('Transportadora não respondeu','A API demorou demais para responder. Tente cotar de novo.');
  if(/401|403|unauthorized|forbidden|credencial|token|autentica/.test(t))
    return R('Falha de acesso à transportadora','Credencial inválida ou expirada — precisa renovar o acesso.');
  if(/tabela|de-para|praça|praca|(nao|não) cadastrad|sem tabela/.test(t))
    return R('Sem tabela de preço','Esta transportadora não tem tabela cadastrada para o destino.');
  if(/peso|cubag|dimens|volume|medida/.test(t))
    return R('Problema com peso ou medidas',txt);
  if(/http 5\d\d|500|502|503|504|instabil|indispon[ií]vel/.test(t))
    return R('Transportadora indisponível','A API da transportadora está fora do ar no momento.');
  if(/failed to fetch|network|net::/.test(t))
    return R('Sem conexão','Não foi possível falar com o servidor. Verifique a internet.');
  if(/cnpj|cpf|documento/.test(t))
    return R('Documento do destinatário inválido',txt);
  if(/valor.*(nf|mercadoria)/.test(t))
    return R('Valor da NF inválido',txt);
  return R('Não foi possível cotar',txt||'Erro desconhecido.');
}

async function cotar(){
  const id_local=parseInt(document.getElementById('id_local')?.value);
  const cep=(document.getElementById('cep')?.value||'').replace(/\D/g,'');
  const cnpj=(document.getElementById('cnpj')?.value||'').replace(/\D/g,'');
  const valor_nf=parseFloat(document.getElementById('vnf')?.value)||0;
  if(!cep||cep.length<8){toast('Informe o CEP destino','error');return}
  // valida tamanho do documento se informado
  if(cnpj&&cnpj.length!==11&&cnpj.length!==14){toast('CPF deve ter 11 dígitos ou CNPJ 14 dígitos','error');return}
  const tipo_dest=cnpj.length===11?'PF':cnpj.length===14?'PJ':null;
  const pacotes=volumes.map(v=>({
    quantidade:v.quantidade,peso_kg:v.peso_kg,
    altura_cm:v.altura_cm,largura_cm:v.largura_cm,comprimento_cm:v.comprimento_cm
  }));
  if(!pacotes.length){toast('Adicione ao menos um volume','error');return}
  if(pacotes.some(p=>p.peso_kg<=0)){toast('Há volume sem peso informado','error');return}
  const rd=document.getElementById('result');
  rd.innerHTML=`<div class="loading"><div class="spinner"></div>Consultando transportadoras...</div>`;
  rd.scrollIntoView({behavior:'smooth',block:'nearest'});
  try{
    const r=await fetch(`${EDGE}/cotar-frete-index`,{method:'POST',
      headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':`Bearer ${KEY}`},
      body:JSON.stringify({id_local,cep_destino:cep,cnpj_destinatario:cnpj||undefined,tipo_destinatario:tipo_dest,valor_nf,pacotes})});
    if(!r.ok)throw new Error(`HTTP ${r.status}: ${(await r.text()).slice(0,300)}`);
    // Trata resposta NDJSON (streaming) ou JSON normal
    const txt=await r.text();
    let data;
    try{data=JSON.parse(txt)}catch{
      // NDJSON: cada linha é um JSON separado
      const lines=txt.split('\n').filter(l=>l.trim());
      const chunks=lines.map(l=>{try{return JSON.parse(l)}catch{return null}}).filter(Boolean);
      const resultados=[];let meta={};
      for(const c of chunks){
        if(c.transportadora) resultados.push(c);
        else Object.assign(meta,c);
      }
      data={...meta,resultados};
    }
    bononiLog('ACAO','COTACAO_REALIZADA',{modulo:'cotacao',contexto:{cep,tipo_dest,volumes:pacotes.length,resultados:data?.resultados?.length}});
    renderResult(data,rd,tipo_dest);
    // A Edge Function cotar-frete-index já grava a cotação (frt_cotacoes + pacotes + respostas).
    // NÃO gravar de novo aqui — o salvarCotacao antigo criava uma cotação duplicada e vazia.
  }catch(e){
    bononiLog('ERRO','ERRO_COTACAO',{modulo:'cotacao',erro:e,contexto:{cep}});
    const em=msgErroFrete(e.message);
    rd.innerHTML=`<div class="card err-box">
      <div class="err-ic"><i class="ic ic-lg" data-ic="triangle-alert"></i></div>
      <div style="flex:1">
        <div class="err-tit">${em.titulo}</div>
        <div class="err-det">${em.detalhe}</div>
        <details class="err-tec"><summary>Detalhe técnico</summary><code>${em.tecnico.replace(/</g,'&lt;')}</code></details>
      </div>
    </div>`;
    toast(em.titulo,'error');
  }
}
async function salvarCotacao({id_local,cep,cnpj,tipo_dest,valor_nf,pacotes,data}){
  try{
    // 1. Salvar cotação principal
    const cotacao={
      id_local,
      cep_destino:cep,
      cidade_destino:data?.cidade_destino||null,
      uf_destino:data?.uf_destino||null,
      valor_nf:valor_nf||0,
      peso_total_kg:data?.peso_total_kg||null,
      criado_por:user||'Usuário'
    };
    const rCot=await fetch(`${SB}/rest/v1/frt_cotacoes`,{
      method:'POST',headers:{...hdrs(),'Prefer':'return=representation'},
      body:JSON.stringify(cotacao)
    });
    if(!rCot.ok) throw new Error(`Cotação: HTTP ${rCot.status}`);
    const [saved]=await rCot.json();
    if(!saved?.id) return;

    // 2. Salvar respostas das transportadoras
    const respostas=(data?.resultados||[]).map(r=>({
      id_cotacao:saved.id,
      transportadora:r.transportadora||'—',
      valor_frete:r.valor_frete||null,
      valor_total:r.valor_total??r.valor_frete??null,
      prazo_dias:r.prazo_dias||null,
      erro:r.erro||null
    }));
    if(respostas.length){
      await fetch(`${SB}/rest/v1/frt_cotacoes_respostas`,{
        method:'POST',headers:{...hdrs(),'Prefer':'return=minimal'},
        body:JSON.stringify(respostas)
      });
    }
  }catch(e){
    bononiLog('ERRO','ERRO_SALVAR_COTACAO',{modulo:'cotacao',erro:e});
  }
}

function renderResult(data,c,tipo_dest){
  const res=data?.resultados||[];
  if(!res.length){c.innerHTML=`<div class="card"><div class="empty"><i class="ic ic-xl ei" data-ic="search"></i><p>Nenhuma cotação retornada.<br>Verifique o CEP e local de expedição.</p></div></div>`;return}
  // valor_total pode não vir no stream NDJSON — fallback pro valor_frete
  const vTot=r=>Number(r.valor_total??r.valor_frete)||0;
  const ok=res.filter(r=>!r.erro).sort((a,b)=>vTot(a)-vTot(b));
  const er=res.filter(r=>r.erro);

  const _cid=data.cidade||data.cidade_destino, _uf=data.uf||data.uf_destino, _pt=data.peso_taxado??data.peso_total_kg;

    html+=`<div class="mb-3"><span class="tag"><i class="ic ic-sm" data-ic="map-pin"></i> ${_cid||''}${_uf?' / '+_uf:''}</span>${_pt?`<span class="tag"><i class="ic ic-sm" data-ic="scale"></i> ${N(_pt)} kg</span>`:''}${tipo_dest?`<span class="tag"><i class="ic ic-sm" data-ic="user"></i> ${tipo_dest==='PF'?'Pessoa Física':'Pessoa Jurídica'}</span>`:''}</div>`;

    if(r.erro){
      const em=msgErroFrete(r.erro);
      html+=`<div class="r-card r-error">
        <div class="r-transp">${r.transportadora||'—'}</div>

        <details class="err-tec"><summary>Detalhe técnico</summary><code>${em.tecnico.replace(/</g,'&lt;')}</code></details>
      </div>`;return}
    const w=i===0;
    html+=`<div class="r-card${w?' winner':''}">
      ${w?'<span class="r-winner-badge"><i class="ic ic-sm" data-ic="check"></i> Menor Preço</span>':''}
      <div class="r-transp">${r.transportadora}</div>
      <div class="r-prazo"><i class="ic ic-sm" data-ic="timer"></i> ${r.prazo_dias??'?'} dia(s) úteis</div>
      <div class="r-preco">${R(vTot(r))}</div>
      ${r.valor_total&&r.valor_frete&&Number(r.valor_total)!==Number(r.valor_frete)?`<div class="r-detail">Frete: ${R(r.valor_frete)}</div>`:''}
      ${r.valor_pedagio?`<div class="r-detail">Pedágio: ${R(r.valor_pedagio)}</div>`:''}
      ${r.valor_gris?`<div class="r-detail">GRIS: ${R(r.valor_gris)}</div>`:''}
      ${r.id_cotacao?`<div class="r-detail" style="font-size:var(--fs-11);color:var(--muted)">Protocolo: ${r.id_cotacao}</div>`:''}
    </div>`;
  });
  html+=`</div></div>`;c.innerHTML=html;
}

function filtrarCtesDados(ctes,mes,st,q){
  return ctes.filter(r=>{
    const dataCte=r.data_emissao||r.criado_em||'';
    const matchMes=!mes||dataCte.startsWith(mes);
    const matchSt=!st||r.status_auditoria===st;
    const qq=q.toLowerCase();
    const matchQ=!qq||(r.nome_transportadora||'').toLowerCase().includes(qq)||(r.nome_destinatario||'').toLowerCase().includes(qq)||(r.num_cte||'').includes(qq);
    return matchMes&&matchSt&&matchQ;
  });
}

function sortCTE(col){
  const prev=auditSort;
  auditSort={col,dir:prev.col===col&&prev.dir==='asc'?'desc':'asc'};
  // atualiza ícones
  document.querySelectorAll('[id^="sh-"]').forEach(el=>el.textContent='');
  const sh=document.getElementById(`sh-${col}`);
  if(sh)sh.innerHTML=auditSort.dir==='asc'?ic('arrow-up','ic-sm'):ic('arrow-down','ic-sm');
  filtCTE();
}

function filtCTE(){
  const c=document.getElementById('pg'),ctes=c.__ctes||[];
  const st=document.getElementById('fst')?.value||'';
  const q=document.getElementById('ftr')?.value||'';
  let f=filtrarCtesDados(ctes,mesGlobal,st,q);
  const{col,dir}=auditSort;
  f=[...f].sort((a,b)=>{
    let va=a[col]??'',vb=b[col]??'';
    const na=parseFloat(va),nb=parseFloat(vb);
    if(!isNaN(na)&&!isNaN(nb)){va=na;vb=nb;}
    if(va<vb)return dir==='asc'?-1:1;
    if(va>vb)return dir==='asc'?1:-1;
    return 0;
  });
  const tb=document.getElementById('cte-tb');
  if(tb)tb.innerHTML=renderCTEdesk(f);
  const mb=document.getElementById('cte-mob');
  if(mb)mb.innerHTML=renderCTEmob(f);
}

// Escapa texto que vai para dentro de elemento (textarea) ou atributo.

  return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function stBadge(s){
  const m={pendente:'b-warn',ok:'b-ok',divergencia:'b-red',contestado:'b-blue',sem_vinculo:'b-gray'};

async function updCTE(id,val,campo){
  try{
    const body=campo==='status'?{status_auditoria:val,atualizado_em:new Date().toISOString()}:{observacao_auditoria:val,atualizado_em:new Date().toISOString()};
    const r=await fetch(`${SB}/rest/v1/frt_conhecimentos?id=eq.${id}`,{method:'PATCH',headers:{...hdrs(),'Prefer':'return=minimal'},body:JSON.stringify(body)});
    if(!r.ok)throw new Error(`[${r.status}] ${(await r.text()).slice(0,200)}`);
    bononiLog('ACAO',campo==='status'?'ALTERAR_STATUS':'ALTERAR_OBS',{modulo:'auditoria',entidade:'cte',id_entidade:id,depois:{[campo]:val}});
    toast(campo==='status'?`Status: ${val}`:'Observação salva','success');
    const c=document.getElementById('pg');if(c.__ctes){const x=c.__ctes.find(x=>x.id===id);if(x){if(campo==='status')x.status_auditoria=val;else x.observacao_auditoria=val;}}
  }catch(e){
    bononiLog('ERRO','ERRO_ATUALIZAR_CTE',{modulo:'auditoria',entidade:'cte',id_entidade:id,erro:e,contexto:{campo,val}});
    toast('Erro: '+e.message,'error');
  }
}

function confSet(k,v){confFiltro[k]=v;aplicarConf();}

function confNFs(r){return((r.notas_fiscais||[]).map(n=>n&&n.num_nf).filter(Boolean).join(', '))||'—';}
function fmtVenc(iso){return iso?String(iso).slice(0,10).split('-').reverse().join('/'):'—';}
function vencCls(iso){
  if(!iso)return 'b-gray';
  const hoje=new Date();hoje.setHours(0,0,0,0);
  const dias=Math.round((new Date(iso+'T00:00:00')-hoje)/86400000);
  if(dias<0)return 'b-red';        // vencido
  if(dias<=5)return 'b-warn';      // vence já
  return 'b-ok';
}
function transpCurto(n){n=(n||'').toUpperCase();if(n.includes('MIGUEL'))return 'São Miguel';if(n.includes('RODONAVES')||n.includes('RTE'))return 'Rodonaves';if(n.includes('BRASPRESS'))return 'Braspress';return (n.split(' ')[0]||'—');}
const EMP_CNPJ={"57129987000166":1,"05864790000177":2,"05864790000258":3,"05864790000339":4,"73403826000175":5,"51054503000180":6,"15090647000200":8,"15090647000119":7,"15090647000129":7};
function saoMiguel(r){return (r.nome_transportadora||'').toUpperCase().includes('MIGUEL');}
function empresaCte(r){
  const ch=r.notas_fiscais&&r.notas_fiscais[0]&&r.notas_fiscais[0].chave_nfe;
  if(!ch||String(ch).length<20)return null;
  return EMP_CNPJ[String(ch).substring(6,20)]??null;
}
function pintarFaturas(){
  const c=document.getElementById('pg'),box=document.getElementById('conf-faturas');
  if(box)box.innerHTML=renderFaturasPanel(c.__faturas||[],c.__conf||[]);
}
function renderFaturasPanel(faturas,ctes){
  // só faturas com dado de verdade (vencimento captado)
  faturas=(faturas||[]).filter(f=>f.vencimento);
  if(!faturas.length)return '';
  const soma=faturas.reduce((s,f)=>s+Number(f.valor_total||0),0);
  const hoje=new Date();hoje.setHours(0,0,0,0);
  const aVencer=faturas.filter(f=>f.vencimento&&new Date(f.vencimento+'T00:00:00')>=hoje).length;
  const vinc={};(ctes||[]).forEach(r=>{if(r.num_fatura)vinc[r.num_fatura]=(vinc[r.num_fatura]||0)+1;});
  const rows=faturas.slice(0,120).map(f=>{

    const acao=sm

    <div class="table-wrap" style="max-height:300px;overflow-y:auto">

// ---- Vínculo assistido: fatura São Miguel -> CTes ----
let _vinc=null;
function vincVal(r){return Number(r.valor_total_cte||r.valor_frete_cte||0);}
function abrirVincular(numFatura){
  const c=document.getElementById('pg');
  const f=(c.__faturas||[]).find(x=>String(x.num_fatura)===String(numFatura)&&(x.transportadora||'').toUpperCase().includes('MIGUEL'));
  if(!f){toast('Fatura não encontrada','error');return;}
  // janela: CTes emitidos até ~70 dias antes do vencimento (a fatura fecha antes de vencer)
  const vd=f.vencimento?new Date(f.vencimento+'T00:00:00'):null;
  const ini=vd?new Date(vd.getTime()-70*86400000):null, fim=vd?new Date(vd.getTime()+5*86400000):null;
  const cand=(c.__conf||[]).filter(r=>{
    if(!saoMiguel(r)||empresaCte(r)!==f.id_empresa)return false;
    if(r.num_fatura&&String(r.num_fatura)!==String(f.num_fatura))return false;
    if(vd&&r.data_emissao){const d=new Date(String(r.data_emissao).slice(0,10)+'T00:00:00');if(d<ini||d>fim)return false;}
    return true;
  }).sort((a,b)=>String(a.data_emissao||'').localeCompare(String(b.data_emissao||'')));
  const sel=new Set(cand.filter(r=>String(r.num_fatura)===String(f.num_fatura)).map(r=>r.id));
  _vinc={f,cand,sel};
  pintarModal();
}
function pintarModal(){
  const {f,cand,sel}=_vinc;
  const total=Number(f.valor_total||0);
  const somaSel=cand.filter(r=>sel.has(r.id)).reduce((s,r)=>s+vincVal(r),0);
  const bate=Math.abs(somaSel-total)<0.01;
  let m=document.getElementById('conf-modal');
  if(!m){m=document.createElement('div');m.id='conf-modal';document.body.appendChild(m);}
  m.setAttribute('style','position:fixed;inset:0;background:rgba(8,15,30,.55);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px');
  const linhas=cand.map(r=>{
    const on=sel.has(r.id);
    return `<tr onclick="vincToggle('${r.id}')" style="cursor:pointer;${on?'background:var(--blue-pale)':''}">
      <td style="text-align:center"><input type="checkbox" ${on?'checked':''} onclick="event.stopPropagation();vincToggle('${r.id}')" style="width:16px;height:16px"/></td>
      <td class="mono">${r.num_cte||'—'}</td>
      <td>${(r.data_emissao||'').slice(0,10).split('-').reverse().join('/')}</td>
      <td class="mono">${confNFs(r)}</td>
      <td>${r.nome_destinatario||'—'}</td>
      <td class="mono" style="text-align:right">${R(vincVal(r))}</td>
    </tr>`;}).join('')||`<tr><td colspan="6" style="text-align:center;padding:20px;color:var(--muted)">Nenhum CTe do São Miguel dessa empresa disponível.</td></tr>`;
  m.innerHTML=`<div class="card" style="max-width:760px;width:100%;max-height:88vh;overflow:auto;margin:0">
    <div class="flex jb ac mb-3" style="gap:8px">
      <div class="card-title" style="margin:0">Vincular fatura ${f.num_fatura} <span class="faint" style="font-weight:400">${f.empresa||''} · vence ${fmtVenc(f.vencimento)}</span></div>
      <button class="btn btn-ghost btn-sm" onclick="fecharModal()" aria-label="Fechar"><i class="ic ic-sm" data-ic="x"></i></button>
    </div>
    <div class="faint" style="font-size:var(--fs-12);margin-bottom:8px">Marque os CTes desta fatura. O total é <b>referência</b> (a fatura inclui impostos/ajustes — pode não bater exato). Ao vincular, o vencimento <b>${fmtVenc(f.vencimento)}</b> cola em cada CTe.${f.link_fatura?` · <a href="${f.link_fatura}" target="_blank" rel="noopener">abrir fatura no portal <i class="ic ic-sm" data-ic="arrow-up-right"></i></a> (confere a lista oficial de CTes)`:''}</div>
    <div class="table-wrap" style="max-height:46vh;overflow:auto">
      <table><thead><tr><th style="width:34px"></th><th>CTe</th><th>Data</th><th>NF</th><th>Cliente</th><th style="text-align:right">Valor</th></tr></thead>
      <tbody>${linhas}</tbody></table>
    </div>
    <div class="flex jb ac" style="gap:10px;flex-wrap:wrap;margin-top:12px">
      <div style="font-size:var(--fs-13)">Selecionado <b class="mono">${R(somaSel)}</b> / total <b class="mono">${R(total)}</b>
        <span class="badge ${bate?'b-ok':'b-warn'}" style="margin-left:6px">${bate?('bate '+ic('check','ic-sm')):'dif. '+R(Math.abs(somaSel-total))}</span></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost btn-sm" onclick="vincSugerir()">Sugerir seleção</button>
        <button class="btn btn-primary btn-sm" onclick="vincSalvar()">Vincular ${sel.size} CTe(s)</button>
      </div>
    </div>
  </div>`;
}
function vincToggle(id){if(_vinc.sel.has(id))_vinc.sel.delete(id);else _vinc.sel.add(id);pintarModal();}
function vincSugerir(){
  const {f,cand}=_vinc,total=Number(f.valor_total||0);
  const ord=[...cand].sort((a,b)=>vincVal(b)-vincVal(a));
  const sel=new Set();let s=0;
  for(const r of ord){const v=vincVal(r);if(s+v<=total+0.005){sel.add(r.id);s+=v;}}
  _vinc.sel=sel;pintarModal();
}
function fecharModal(){const m=document.getElementById('conf-modal');if(m)m.remove();_vinc=null;}
async function vincSalvar(){
  const {f,cand,sel}=_vinc,venc=f.vencimento,upd=[];
  for(const r of cand){
    const quer=sel.has(r.id),ja=String(r.num_fatura)===String(f.num_fatura);
    if(quer&&!ja)upd.push({r,body:{id_fatura:f.id||null,num_fatura:f.num_fatura,frete_vencimento:venc}});
    else if(!quer&&ja)upd.push({r,body:{id_fatura:null,num_fatura:null,frete_vencimento:null}});
  }
  if(!upd.length){toast('Nada mudou','info');fecharModal();return;}
  try{
    await Promise.all(upd.map(u=>fetch(`${SB}/rest/v1/frt_conhecimentos?id=eq.${u.r.id}`,{method:'PATCH',headers:{...hdrs(),'Prefer':'return=minimal'},body:JSON.stringify(u.body)})));
    upd.forEach(u=>Object.assign(u.r,u.body));
    if(f.id)await fetch(`${SB}/rest/v1/frt_faturas?id=eq.${f.id}`,{method:'PATCH',headers:{...hdrs(),'Prefer':'return=minimal'},body:JSON.stringify({status:'conferida'})}).catch(()=>{});
    f.status='conferida';
    toast(`${upd.length} CTe(s) · vencimento ${fmtVenc(venc)}`,'success');
    fecharModal();aplicarConf();pintarFaturas();
  }catch(e){
    bononiLog('ERRO','ERRO_VINCULAR_FATURA',{modulo:'conferencia',erro:e,contexto:{fatura:f.num_fatura}});
    toast('Erro ao vincular: '+e.message,'error');
  }
}

function confFiltrar(){
  const c=document.getElementById('pg'),ctes=c.__conf||[];
  const{transp,status,q}=confFiltro,qq=(q||'').toLowerCase();
  return ctes.filter(r=>{
    if(!(r.data_emissao||r.criado_em||'').startsWith(mesGlobal))return false;
    if(transp&&r.nome_transportadora!==transp)return false;
    if(status==='a_lancar'&&r.frete_lancado)return false;
    if(status==='lancado'&&!r.frete_lancado)return false;
    if(qq){
      const alvo=`${r.num_cte||''} ${confNFs(r)} ${r.nome_destinatario||''} ${r.nome_vendedor||''}`.toLowerCase();
      if(!alvo.includes(qq))return false;
    }
    return true;
  });
}

function aplicarConf(){
  const f=confFiltrar();
  // stats
  const aLancar=f.filter(x=>!x.frete_lancado),lancados=f.filter(x=>x.frete_lancado);
  const vlAlancar=aLancar.reduce((s,x)=>s+Number(x.valor_total_cte||x.valor_frete_cte||0),0);

  if(st)st.innerHTML=`
    <div class="stat c-blue"><div class="stat-lbl">CTes no mês</div><div class="stat-val">${f.length}</div></div>
    <div class="stat c-warn"><div class="stat-lbl">A lançar</div><div class="stat-val">${aLancar.length}</div></div>
    <div class="stat c-green"><div class="stat-lbl">Lançados</div><div class="stat-val">${lancados.length}</div></div>
    <div class="stat c-red"><div class="stat-lbl">R$ a lançar</div><div class="stat-val" style="font-size:var(--fs-18)">${R(vlAlancar)}</div></div>`;
  // agrupa por transportadora

  if(!chaves.length){box.innerHTML=`<div class="empty"><i class="ic ic-xl ei" data-ic="circle-check"></i><p>Nada a conferir neste filtro.</p></div>`;return;}
  box.innerHTML=chaves.map(k=>{
    const rows=g[k];
    const pend=rows.filter(x=>!x.frete_lancado);
    const somaP=pend.reduce((s,x)=>s+Number(x.valor_total_cte||x.valor_frete_cte||0),0);
    return`
    <div style="margin-bottom:18px">
      <div class="flex jb ac" style="flex-wrap:wrap;gap:8px;margin-bottom:6px">
        <div style="font-weight:700;font-size:var(--fs-13)">${k}
          <span class="badge ${pend.length?'b-warn':'b-ok'}" style="margin-left:6px">${pend.length} a lançar</span>
          <span class="badge b-gray" style="margin-left:2px">${R(somaP)}</span>
        </div>
        ${pend.length?`<button class="btn btn-ghost btn-sm" onclick="confMarcarGrupo('${k.replace(/'/g,"\\'")}')"><i class="ic ic-sm" data-ic="check"></i> Marcar grupo como lançado</button>`:''}
      </div>

      <div class="desktop-only table-wrap">
        <table>
          <thead><tr>
            <th style="width:44px;text-align:center">Lançado</th>
            <th>CTe</th><th>Data</th><th>NF</th><th>Cliente</th><th>UF</th><th>Vendedor</th>
            <th>Venc.</th><th style="text-align:right">Vl. Frete</th>
          </tr></thead>
          <tbody>
            ${rows.map(r=>{
              const done=!!r.frete_lancado;
              return`<tr id="conf-${r.id}" style="${done?'opacity:.5':''}">
                <td style="text-align:center"><input type="checkbox" ${done?'checked':''} onchange="confToggle('${r.id}',this.checked)" style="width:17px;height:17px;cursor:pointer" title="${done?('Lançado '+DT(r.frete_lancado_em)):'Marcar como lançado'}"/></td>
                <td class="mono">${r.num_cte||'—'}</td>
                <td style="white-space:nowrap">${(r.data_emissao||r.criado_em||'').slice(0,10).split('-').reverse().join('/')||'—'}</td>
                <td class="mono">${confNFs(r)}</td>
                <td>${r.nome_destinatario||'—'}</td>
                <td>${r.uf_destino||'—'}</td>
                <td>${r.nome_vendedor||`<span class="badge b-gray">sem vínculo</span>`}</td>
                <td class="mono">${r.frete_vencimento?`<span class="badge ${vencCls(r.frete_vencimento)}">${fmtVenc(r.frete_vencimento)}</span>`:'<span class="faint">—</span>'}</td>
                <td class="mono" style="text-align:right;white-space:nowrap">${R(r.valor_total_cte||r.valor_frete_cte)}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
  }).join('');
}

// Conferência no celular: o que se faz aqui é marcar "lançado". No cartão o alvo
// é a linha inteira (44px), não um checkbox de 17px perdido numa tabela de 9
// colunas. O id do cartão é 'confm-' para não colidir com o 'conf-' da tabela.
function renderConfMob(rows){
  if(!rows.length)return`<div class="empty"><i class="ic ic-xl ei" data-ic="inbox"></i><p>Nada a conferir</p></div>`;
  return rows.map(r=>{
    const done=!!r.frete_lancado;
    return`<div class="cte-card" id="confm-${r.id}" style="${done?'opacity:.55':''}">
      <div class="cte-hdr">
        <div style="min-width:0">
          <div class="cte-num">${r.num_cte||'—'}</div>
          <div class="cte-sub">${(r.data_emissao||r.criado_em||'').slice(0,10).split('-').reverse().join('/')||'—'} · NF ${confNFs(r)}</div>
        </div>
        ${r.frete_vencimento?`<span class="badge ${vencCls(r.frete_vencimento)}">${fmtVenc(r.frete_vencimento)}</span>`:''}
      </div>
      <div class="cte-row"><span class="cte-lbl">Cliente</span><span class="cte-val">${r.nome_destinatario||'—'}${r.uf_destino?' / '+r.uf_destino:''}</span></div>
      <div class="cte-row"><span class="cte-lbl">Vendedor</span><span class="cte-val">${r.nome_vendedor||`<span class="badge b-gray">sem vínculo</span>`}</span></div>
      <div class="cte-row"><span class="cte-lbl">Vl. Frete</span><span class="cte-val" style="font-family:var(--font-mono);font-variant-numeric:tabular-nums">${R(r.valor_total_cte||r.valor_frete_cte)}</span></div>
      <label class="cte-row" for="confm-ck-${r.id}" style="cursor:pointer;border-bottom:none;padding-top:10px;min-height:var(--control-h-lg)">
        <span class="cte-lbl">${done?'Lançado '+DT(r.frete_lancado_em):'Marcar como lançado'}</span>
        <input type="checkbox" id="confm-ck-${r.id}" ${done?'checked':''} onchange="confToggle('${r.id}',this.checked)"
          style="width:22px;height:22px;min-height:0;flex:0 0 auto;cursor:pointer"/>
      </label>
    </div>`;
  }).join('');
}

async function confToggle(id,checked){
  const c=document.getElementById('pg'),item=(c.__conf||[]).find(x=>x.id==id);
  const body={frete_lancado:checked,frete_lancado_em:checked?new Date().toISOString():null,frete_lancado_por:checked?user:null};
  try{
    const r=await fetch(`${SB}/rest/v1/frt_conhecimentos?id=eq.${id}`,{method:'PATCH',headers:{...hdrs(),'Prefer':'return=minimal'},body:JSON.stringify(body)});
    if(!r.ok)throw new Error('HTTP '+r.status);
    if(item)Object.assign(item,body);
    aplicarConf();
    toast(checked?'CTe marcado como lançado':'Desmarcado','success');
  }catch(e){
    bononiLog('ERRO','ERRO_CONF_TOGGLE',{modulo:'conferencia',entidade:'cte',id_entidade:id,erro:e});
    toast('Erro ao salvar: '+e.message,'error');
    aplicarConf();
  }
}

async function confMarcarGrupo(transp){
  const c=document.getElementById('pg');
  const alvo=confFiltrar().filter(x=>x.nome_transportadora===transp&&!x.frete_lancado);
  if(!alvo.length)return;
  if(!confirm(`Marcar ${alvo.length} CTe(s) de ${transp} como lançados?`))return;
  const agora=new Date().toISOString();
  try{
    await Promise.all(alvo.map(x=>fetch(`${SB}/rest/v1/frt_conhecimentos?id=eq.${x.id}`,{method:'PATCH',headers:{...hdrs(),'Prefer':'return=minimal'},body:JSON.stringify({frete_lancado:true,frete_lancado_em:agora,frete_lancado_por:user})})));
    alvo.forEach(x=>{x.frete_lancado=true;x.frete_lancado_em=agora;x.frete_lancado_por=user;});
    aplicarConf();
    toast(`${alvo.length} CTe(s) marcados como lançados`,'success');
  }catch(e){
    bononiLog('ERRO','ERRO_CONF_GRUPO',{modulo:'conferencia',erro:e,contexto:{transp}});
    toast('Erro: '+e.message,'error');
  }
}

function filtrarPorMes(rows,campo,mes){
  if(!mes) return rows;
