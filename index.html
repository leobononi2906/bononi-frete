      <div class="hist-row"><span class="hist-lbl">Destino</span><span>${r.cidade_destino||r.cep_destino||'—'}${r.uf_destino?' / '+r.uf_destino:''}</span></div>
      <div class="hist-row"><span class="hist-lbl">Valor NF</span><span>${R(r.valor_nf)}</span></div>
      ${res.map(x=>{const v=x.valor_frete;const isMin=menor?.transportadora===x.transportadora;return`<div class="hist-row"><span class="hist-lbl">${x.transportadora}</span><span style="font-weight:${isMin?700:400};color:${isMin?'var(--green)':'inherit'}">${R(v)}${x.prazo_dias?' · '+x.prazo_dias+'d':''}${x.id_cotacao_ext?' · #'+x.id_cotacao_ext:''}</span></div>`}).join('')}
      ${(rm[r.id]||[]).filter(x=>x.erro&&!x.valor_frete).map(x=>`<div class="hist-row"><span class="hist-lbl">${x.transportadora}</span><span class="text-muted" style="font-size:var(--fs-11)">Indisp.</span></div>`).join('')}
      ${menor?`<div class="hist-row" style="border-top:1px solid var(--border);padding-top:6px;margin-top:4px"><span class="hist-lbl"><i class="ic ic-sm" data-ic="check"></i> Menor</span><span style="color:var(--green);font-weight:700">${menor.transportadora} — ${R(menor.valor_frete)}</span></div>`:''}
      <div class="hist-row"><span class="hist-lbl">Usuário</span><span class="text-muted">${r.criado_por||'—'}</span></div>
    </div>`;
  }).join('');
}

function renderHistDesk(rows,lm,rm,transp){
  if(!rows.length)return`<tr><td colspan="${5+transp.length+2}"><div class="empty"><i class="ic ic-xl ei" data-ic="inbox"></i><p>Sem cotações</p></div></td></tr>`;
  return rows.map(r=>{
    const res=rm[r.id]||[];
    const byT={};res.forEach(x=>{byT[x.transportadora]=x});
    const ok=res.filter(x=>x.valor_frete).sort((a,b)=>(a.valor_frete||0)-(b.valor_frete||0));
    const menor=ok[0];
    return`<tr>
      <td style="white-space:nowrap;font-family:var(--font-mono);font-size:var(--fs-12)">${r.codigo||'—'}${r.id?`<br><span style="font-size:var(--fs-11);color:var(--muted)">ID ${r.id}</span>`:''}</td>
      <td style="white-space:nowrap">${DT(r.criado_em)}</td>
      <td>${lm[r.id_local]||'—'}</td>
      <td style="white-space:nowrap">${r.cidade_destino||r.cep_destino||'—'}${r.uf_destino?' / '+r.uf_destino:''}</td>
      <td style="white-space:nowrap">${R(r.valor_nf)}</td>
      ${transp.map(t=>{
        const x=byT[t];
        if(!x)return`<td style="text-align:center;color:var(--muted)">—</td>`;
        const v=x.valor_frete;
        if(!v)return`<td style="text-align:center;font-size:var(--fs-11);color:var(--muted)">Indisp.</td>`;
        const isMin=menor?.transportadora===t;
        return`<td style="text-align:center;font-weight:${isMin?700:400};color:${isMin?'var(--green)':'inherit'}">
          ${R(v)}<br><span style="font-size:var(--fs-11);color:var(--muted)">${x.prazo_dias?x.prazo_dias+'d':''}${x.id_cotacao_ext?'<br>#'+x.id_cotacao_ext:''}</span>
        </td>`;
      }).join('')}
      <td style="white-space:nowrap">${menor?`<span class="badge b-ok" style="font-size:var(--fs-11)">${menor.transportadora}</span>`:'—'}</td>
      <td class="text-muted" style="white-space:nowrap">${r.criado_por||'—'}</td>
    </tr>`;
  }).join('');
}

function filtHist(){
  const c=document.getElementById('pg');
  const rows=c.__hist||[],lm=c.__lm||{},rm=c.__rm||{},transp=c.__transp||[];
  const q=(document.getElementById('fh')?.value||'').toLowerCase();
  let f=filtrarPorMes(rows,'criado_em',mesGlobal);
  if(q) f=f.filter(r=>(r.cep_destino||'').includes(q)||(r.cidade_destino||'').toLowerCase().includes(q)||(r.criado_por||'').toLowerCase().includes(q));
  const mob=document.getElementById('hist-mob'),tb=document.getElementById('hist-tb');
  if(mob)mob.innerHTML=renderHistMob(f,lm,rm);
  if(tb)tb.innerHTML=renderHistDesk(f,lm,rm,transp);
}

// ────────────────────────────────────────────
// PAGE: DIMENSÕES DE PRODUTOS
// ────────────────────────────────────────────
let _editDimId=null;

function editDim(id){
  const c=document.getElementById('pg');
  const p=(c?.__dims||[]).find(x=>x.id===id);
  if(!p){toast('Produto não encontrado','error');return}
  _editDimId=id;
  const set=(el,v)=>{const e=document.getElementById(el);if(e)e.value=v??''};
  set('nd',p.descricao);set('nr',p.referencia);set('np',p.peso_kg);
  set('na',p.altura_cm);set('nl',p.largura_cm);set('nc',p.comprimento_cm);
  const t=document.getElementById('dim-form-title');if(t)t.textContent='Editando: '+(p.descricao||'');
  const b=document.getElementById('btn-salvar-dim');if(b)b.textContent='Salvar alterações';
  const x=document.getElementById('btn-cancel-dim');if(x)x.style.display='';
  document.getElementById('card-dim-form')?.scrollIntoView({behavior:'smooth',block:'center'});
}

function cancelarEditDim(){
  _editDimId=null;
  ['nd','nr','np','na','nl','nc'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=''});
  const t=document.getElementById('dim-form-title');if(t)t.textContent='Novo Cadastro Manual';
  const b=document.getElementById('btn-salvar-dim');if(b)b.textContent='Salvar Dimensão';
  const x=document.getElementById('btn-cancel-dim');if(x)x.style.display='none';
}

async function pgDimensoes(){
  _editDimId=null;
  const c=document.getElementById('pg');
  c.innerHTML=`<div class="loading"><div class="spinner"></div>Carregando...</div>`;
  try{
    const [dims,cat]=await Promise.all([
      db('frt_produtos_dimensoes?select=*&ativo=eq.true&order=descricao'),
      db('frt_catalogo_produtos?select=id,nome,referencia,peso_kg,altura_cm,largura_cm,comprimento_cm,volume_m3&ativo=eq.true&order=nome')
    ]);
    c.__dims=dims;c.__cat=cat;
    c.innerHTML=`
      <div class="stats-grid" style="grid-template-columns:1fr 1fr 1fr">
        <div class="stat c-blue"><div class="stat-lbl">Portal Representantes</div><div class="stat-val">${cat.length}</div></div>
        <div class="stat c-green"><div class="stat-lbl">Cadastros Manuais</div><div class="stat-val">${dims.length}</div></div>
        <div class="stat c-warn"><div class="stat-lbl">Total disponível</div><div class="stat-val">${cat.length+dims.length}</div></div>
      </div>

      <div class="card" id="card-dim-form">
        <div class="card-title" id="dim-form-title"><i class="ic" data-ic="plus"></i> Novo Cadastro Manual</div>
        <div class="grid g2">
          <div class="field full"><label>Descrição / Nome do produto</label><input id="nd" placeholder="Ex: Volante Esportivo 14 pol"/></div>
          <div class="field"><label>Referência</label><input id="nr" placeholder="Ex: VE-14"/></div>
          <div class="field"><label>Peso (kg)</label><input id="np" type="number" placeholder="0.000" step="0.001" inputmode="decimal"/></div>
          <div class="field"><label>Altura (cm)</label><input id="na" type="number" placeholder="0" inputmode="numeric"/></div>
          <div class="field"><label>Largura (cm)</label><input id="nl" type="number" placeholder="0" inputmode="numeric"/></div>
          <div class="field"><label>Comprimento (cm)</label><input id="nc" type="number" placeholder="0" inputmode="numeric"/></div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-ghost" id="btn-cancel-dim" onclick="cancelarEditDim()" style="display:none;flex-shrink:0">Cancelar</button>
          <button class="btn btn-primary" id="btn-salvar-dim" onclick="salvarDim()" style="flex:1"><i class="ic" data-ic="save"></i> Salvar Dimensão</button>
        </div>
      </div>

      <div class="card">
        <div class="flex jb ac mb-3" style="flex-wrap:wrap;gap:8px">
          <div class="card-title" style="margin:0"><i class="ic" data-ic="package"></i> Dimensões Cadastradas</div>
          <div class="filters" style="margin:0">
            <select class="fi" id="dfonte" onchange="filtDim()" style="flex:0 0 auto;min-width:140px">
              <option value="">Todas as fontes</option>
              <option value="catalogo">Portal Representantes</option>
              <option value="manual">Cadastro Manual</option>
            </select>
            <input class="fi" id="dq" placeholder="Buscar produto..." oninput="filtDim()"/>
          </div>
        </div>
        <div id="dims-list">${renderDims(dims,cat)}</div>
      </div>`;
  }catch(e){c.innerHTML=`<div class="empty"><i class="ic ic-xl ei" data-ic="circle-x"></i><p>${e.message}</p></div>`}
}

function renderDims(dims,cat){
  const all=[
    ...cat.map(p=>({...p,_src:'catalogo',descricao:p.nome})),
    ...dims.map(p=>({...p,_src:'manual'}))
  ];
  if(!all.length)return`<div class="empty"><i class="ic ic-xl ei" data-ic="inbox"></i><p>Nenhum produto cadastrado</p></div>`;
  return`<div class="mobile-only">${renderDimsMob(all)}</div>
  <div class="desktop-only table-wrap">
    <table>
      <thead><tr><th>Fonte</th><th>Produto</th><th>Ref.</th><th>Peso</th><th>A×L×C (cm)</th><th>Vol. m³</th><th></th></tr></thead>
      <tbody>
        ${all.map(p=>{
          const vol=p.volume_m3||(p.altura_cm&&p.largura_cm&&p.comprimento_cm?(p.altura_cm/100*p.largura_cm/100*p.comprimento_cm/100).toFixed(6):null);
          const inc=!medidasCompletas(p);
          return`<tr${inc?' style="background:var(--warning-bg)"':''}>
            <td><span class="badge ${p._src==='catalogo'?'b-blue':'b-purple'}">${p._src==='catalogo'?'Portal':'Manual'}</span>${inc?'<div style="font-size:var(--fs-11);color:var(--warn);font-weight:700;margin-top:3px">SEM MEDIDA</div>':''}</td>
            <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600">${p.descricao||p.nome||'—'}</td>
            <td class="text-muted">${p.referencia||'—'}</td>
            <td>${p.peso_kg?N(p.peso_kg)+' kg':'—'}</td>
            <td>${p.altura_cm&&p.largura_cm&&p.comprimento_cm?`${p.altura_cm}×${p.largura_cm}×${p.comprimento_cm}`:'—'}</td>
            <td>${vol?Number(vol).toFixed(4):'—'}</td>
            <td style="white-space:nowrap">${p._src==='manual'?`<button class="btn btn-ghost btn-sm" onclick="editDim(${p.id})" aria-label="Editar" title="Editar" style="padding:5px 9px;margin-right:4px"><i class="ic ic-sm" data-ic="pencil"></i></button><button class="btn btn-danger btn-sm" onclick="delDim(${p.id})" aria-label="Excluir" title="Excluir" style="padding:5px 9px"><i class="ic ic-sm" data-ic="trash-2"></i></button>`:'—'}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
}

// Dimensões no celular. "Sem medida" era uma linha de tabela com fundo âmbar —
// no cartão vira etiqueta, que não depende de enxergar a cor da linha inteira.
function renderDimsMob(all){
  return all.map(p=>{
    const vol=p.volume_m3||(p.altura_cm&&p.largura_cm&&p.comprimento_cm?(p.altura_cm/100*p.largura_cm/100*p.comprimento_cm/100).toFixed(6):null);
    const inc=!medidasCompletas(p);
    return`<div class="cte-card"${inc?' style="background:var(--warning-bg)"':''}>
      <div class="cte-hdr">
        <div style="min-width:0">
          <div style="font:var(--type-body-strong);overflow-wrap:anywhere">${p.descricao||p.nome||'—'}</div>
          <div class="cte-sub">Ref: ${p.referencia||'—'}</div>
        </div>
        <span class="badge ${p._src==='catalogo'?'b-blue':'b-purple'}">${p._src==='catalogo'?'Portal':'Manual'}</span>
      </div>
      ${inc?`<div class="cte-row"><span class="cte-lbl">Medidas</span><span class="cte-val"><span class="badge b-warn">sem medida</span></span></div>`:''}
      <div class="cte-row"><span class="cte-lbl">Peso</span><span class="cte-val">${p.peso_kg?N(p.peso_kg)+' kg':'—'}</span></div>
      <div class="cte-row"><span class="cte-lbl">A×L×C (cm)</span><span class="cte-val">${p.altura_cm&&p.largura_cm&&p.comprimento_cm?`${p.altura_cm}×${p.largura_cm}×${p.comprimento_cm}`:'—'}</span></div>
      <div class="cte-row"><span class="cte-lbl">Vol. m³</span><span class="cte-val" style="font-family:var(--font-mono);font-variant-numeric:tabular-nums">${vol?Number(vol).toFixed(4):'—'}</span></div>
      ${p._src==='manual'?`<div class="cte-actions">
        <button class="btn btn-ghost btn-sm" onclick="editDim(${p.id})">${ic('pencil','ic-sm')} Editar</button>
        <button class="btn btn-danger btn-sm" onclick="delDim(${p.id})">${ic('trash-2','ic-sm')} Excluir</button>
      </div>`:''}
    </div>`;
  }).join('');
}

function filtDim(){
  const c=document.getElementById('pg');
  const dims=c.__dims||[],cat=c.__cat||[];
  const fonte=document.getElementById('dfonte')?.value||'';
  const q=(document.getElementById('dq')?.value||'').toLowerCase();
  let fd=dims,fc=cat;
  if(fonte==='manual')fc=[];
  if(fonte==='catalogo')fd=[];
  if(q){fd=fd.filter(p=>(p.descricao||'').toLowerCase().includes(q)||(p.referencia||'').toLowerCase().includes(q));fc=fc.filter(p=>(p.nome||'').toLowerCase().includes(q)||(p.referencia||'').toLowerCase().includes(q));}
  document.getElementById('dims-list').innerHTML=renderDims(fd,fc);
}

async function salvarDim(){
  const desc=(document.getElementById('nd')?.value||'').trim();
  const ref=(document.getElementById('nr')?.value||'').trim();
  const peso=parseFloat(document.getElementById('np')?.value)||null;
  const alt=parseFloat(document.getElementById('na')?.value)||null;
  const lar=parseFloat(document.getElementById('nl')?.value)||null;
  const com=parseFloat(document.getElementById('nc')?.value)||null;
  if(!desc){toast('Informe a descrição do produto','error');return}
  if(!peso){toast('Informe o peso','error');return}
  const editando=_editDimId!=null;
  const corpo={descricao:desc,referencia:ref||null,peso_kg:peso,altura_cm:alt,largura_cm:lar,comprimento_cm:com,ativo:true,atualizado_em:new Date().toISOString()};
  try{
    const url=editando?`${SB}/rest/v1/frt_produtos_dimensoes?id=eq.${_editDimId}`:`${SB}/rest/v1/frt_produtos_dimensoes`;
    const r=await fetch(url,{
      method:editando?'PATCH':'POST',
      headers:{...hdrs(),'Prefer':'return=representation'},
      body:JSON.stringify(corpo)
    });
    if(!r.ok)throw new Error(`HTTP ${r.status}: ${(await r.text()).slice(0,200)}`);
    bononiLog('ACAO',editando?'EDITAR_DIMENSAO':'CRIAR_DIMENSAO',{modulo:'dimensoes',entidade:'dimensao',id_entidade:_editDimId||null,nome_entidade:desc});
    toast(editando?'Produto atualizado!':'Dimensão salva com sucesso!','success');
    _prodCache=null; // força recarregar o catálogo da cotação
    cancelarEditDim();
    pgDimensoes();
  }catch(e){
    bononiLog('ERRO',editando?'ERRO_EDITAR_DIMENSAO':'ERRO_CRIAR_DIMENSAO',{modulo:'dimensoes',entidade:'dimensao',nome_entidade:desc,erro:e});
    const em=msgErroFrete(e.message);
    toast(em.titulo+' — '+em.detalhe,'error');
  }
}

async function delDim(id){
  if(!await confirmar('Excluir esta dimensão?'))return;
  try{
    const rd=await fetch(`${SB}/rest/v1/frt_produtos_dimensoes?id=eq.${id}`,{
      method:'PATCH',headers:{...hdrs(),'Prefer':'return=minimal'},
      body:JSON.stringify({ativo:false})
    });
    if(!rd.ok)throw new Error(`HTTP ${rd.status}: ${(await rd.text()).slice(0,200)}`);
    bononiLog('ACAO','EXCLUIR_DIMENSAO',{modulo:'dimensoes',entidade:'dimensao',id_entidade:id});
    _prodCache=null;
    toast('Dimensão removida','success');pgDimensoes();
  }catch(e){
    bononiLog('ERRO','ERRO_EXCLUIR_DIMENSAO',{modulo:'dimensoes',entidade:'dimensao',id_entidade:id,erro:e});
    toast('Erro: '+e.message,'error');
  }
}

// ────────────────────────────────────────────
// PAGE: LOGS
// ────────────────────────────────────────────
async function pgLogs(){
  const c=document.getElementById('pg');
  c.innerHTML=`<div class="loading"><div class="spinner"></div>Carregando...</div>`;
  try{
    const logs=await db('frt_logs?select=*&order=criado_em.desc');
    const filtrados=filtrarPorMes(logs,'criado_em',mesGlobal);
    const er=filtrados.filter(l=>l.tipo==='ERRO').length,ac=filtrados.filter(l=>l.tipo==='ACAO').length,inf=filtrados.filter(l=>l.tipo==='INFO').length;
    c.__logs=filtrados;
    c.innerHTML=`
      <div class="stats-grid">
        <div class="stat c-blue"><div class="stat-lbl">Total</div><div class="stat-val">${filtrados.length}</div></div>
        <div class="stat c-red"><div class="stat-lbl">Erros</div><div class="stat-val">${er}</div></div>
        <div class="stat c-green"><div class="stat-lbl">Ações</div><div class="stat-val">${ac}</div></div>
        <div class="stat c-warn"><div class="stat-lbl">Info</div><div class="stat-val">${inf}</div></div>
      </div>
      <div class="card">
        <div class="flex jb ac mb-3" style="flex-wrap:wrap;gap:8px">
          <div class="card-title" style="margin:0"><i class="ic" data-ic="scroll-text"></i> Logs</div>
          <div class="filters" style="margin:0">
            <select class="fi" id="lt" onchange="filtLog()" style="flex:0 0 auto"><option value="">Todos</option><option value="ERRO">Erros</option><option value="ACAO">Ações</option><option value="INFO">Info</option></select>
            <select class="fi" id="lc" onchange="filtLog()" style="flex:0 0 auto"><option value="">Todos módulos</option><option value="cotacao">Cotação</option><option value="auditoria">Auditoria</option><option value="dimensoes">Dimensões</option><option value="banco">Banco</option><option value="sistema">Sistema</option></select>
            <input class="fi" id="lq" placeholder="Buscar..." oninput="filtLog()"/>
          </div>
        </div>
        <div class="flex gap-2 mb-3" style="flex-wrap:wrap">
          <button class="btn btn-ghost btn-sm" onclick="pgLogs()"><i class="ic ic-sm" data-ic="rotate-ccw"></i> Atualizar</button>
          <button class="btn btn-danger btn-sm" onclick="limparLogs()"><i class="ic ic-sm" data-ic="trash-2"></i> Limpar &gt;30 dias</button>
        </div>
        <div id="logs-list">${renderLogs(filtrados)}</div>
      </div>`;
  }catch(e){c.innerHTML=`<div class="empty"><i class="ic ic-xl ei" data-ic="circle-check"></i><p>Nenhum log ou tabela não encontrada.<br><small>${e.message}</small></p></div>`}
}
function renderLogs(logs){
  if(!logs.length)return`<div class="empty"><i class="ic ic-xl ei" data-ic="circle-check"></i><p>Sem eventos</p></div>`;
  const ICONE_LOG={ERRO:'circle-x',ACAO:'circle-check',INFO:'info'};
  const bc={ERRO:'b-red',ACAO:'b-ok',INFO:'b-warn'};
  return logs.map((l,i)=>{
    const det=l.erro_msg||l.erro_stack||l.contexto;
    const desc=l.acao||l.descricao||'—';
    return`<div class="log-item log-${l.tipo}" onclick="document.getElementById('ld-${i}')?.classList.toggle('open')">
    <div class="log-icon">${ic(ICONE_LOG[l.tipo]||'info')}</div>
    <div class="log-body">
      <div class="log-desc">${desc}${l.nome_entidade?` — ${l.nome_entidade}`:l.id_entidade?` #${l.id_entidade}`:''}</div>
      <div class="log-meta">
        <span><i class="ic ic-sm" data-ic="clock"></i> ${DT(l.criado_em)}</span>
        ${l.modulo?`<span><i class="ic ic-sm" data-ic="folder"></i> ${l.modulo}</span>`:''}
        ${l.usuario_nome?`<span><i class="ic ic-sm" data-ic="user"></i> ${l.usuario_nome}</span>`:''}
        <span class="badge ${bc[l.tipo]||'b-ok'}">${l.nivel||l.tipo}</span>
      </div>
      ${l.erro_msg?`<div style="color:var(--danger);font-size:var(--fs-12);margin-top:4px">${l.erro_msg}</div>`:''}
      ${det?`<div class="log-detail" id="ld-${i}">${l.erro_stack?l.erro_stack+'\n':''}${l.contexto?JSON.stringify(l.contexto,null,2):''}</div>`:''}
    </div>
  </div>`}).join('');
}
function filtLog(){
  const c=document.getElementById('pg'),logs=c.__logs||[];
  const t=document.getElementById('lt')?.value||'',mod=document.getElementById('lc')?.value||'',q=(document.getElementById('lq')?.value||'').toLowerCase();
  const f=logs.filter(l=>(!t||l.tipo===t)&&(!mod||l.modulo===mod)&&(!q||JSON.stringify(l).toLowerCase().includes(q)));
  document.getElementById('logs-list').innerHTML=renderLogs(f);
}
async function limparLogs(){
  if(!await confirmar('Excluir logs com mais de 30 dias?'))return;
  try{
    const cut=new Date(Date.now()-30*86400000).toISOString();
    const r=await fetch(`${SB}/rest/v1/frt_logs?criado_em=lt.${cut}`,{method:'DELETE',headers:hdrs()});
    if(!r.ok)throw new Error(`HTTP ${r.status}: ${(await r.text()).slice(0,200)}`);
    bononiLog('ACAO','LIMPAR_LOGS',{modulo:'sistema'});
    toast('Logs antigos removidos','success');pgLogs();
  }catch(e){
    bononiLog('ERRO','ERRO_LIMPAR_LOGS',{modulo:'sistema',erro:e});
    toast('Erro: '+e.message,'error');
  }
}
</script>
